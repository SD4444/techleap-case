<template id="dd-water-data" data-k="" data-h="National data shows the problem. Local evidence must define the intervention.">
  <div class="detail-body compact">
    <p>In 2024, nearly 80% of Dutch crop-protection monitoring locations recorded at least one substance above an ecological water-quality standard.</p>
    <p>This includes herbicides, fungicides, insecticides and their metabolites. The national figure establishes the scale of the problem, but it does not identify which crops, farms or substances caused each exceedance.</p>
    <h4>The local evidence</h4>
    <p>Rijnland has repeatedly detected the herbicides pendimethalin and metazachlor in agricultural areas. It identifies spray drift and runoff from treated fields as pathways into surface water.</p>
    <p>However, removing one herbicide can simply shift use to another. The programme must therefore measure the environmental effect of the complete weed-control strategy.</p>
    <h4>What the pilot must establish</h4>
    <p>Begin with an area where the water authority has identified recurring exceedances from a named herbicide and a plausible agricultural source.</p>
    <p>For participating farms, independently record:</p>
    <ul>
      <li>Hectares treated without the target herbicide</li>
      <li>Herbicide applications displaced</li>
      <li>Substitute products and chemical rescue treatments</li>
      <li>Weed-control efficacy and crop outcomes</li>
      <li>Changes in the environmental risk of the complete treatment programme</li>
    </ul>
    <p>Nearby water monitoring can provide supporting evidence. It should not determine payment because concentrations are also affected by rainfall, neighbouring farms and historic residues.</p>
    <div class="warn"><b>Design rule:</b> Pay for a verified reduction in the environmental burden of weed control, not simply the removal of one product.</div>
    <p class="src"><b>Sources:</b>&nbsp;<a href="https://www.clo.nl/indicatoren/nl054712-gewasbeschermingsmiddelen-in-oppervlaktewater-2013-2024" target="_blank" rel="noopener">CLO, crop-protection products in surface water, 2013 to 2024</a><a href="https://www.rijnland.net/actueel/nieuwsoverzicht/correctie-op-nieuwsbericht-24-maart-2026/" target="_blank" rel="noopener">Rijnland, corrected 2025 monitoring results</a><a href="https://www.landbouwportaalrijnland.nl/nieuws/zorgvuldig-gebruik-pendimethalin-cruciaal-voor-waterkwaliteit/" target="_blank" rel="noopener">Landbouwportaal Rijnland, pendimethalin and water quality</a></p>
  </div>
</template>

<template id="dd-bill" data-k="" data-h="Pesticide pollution can create large downstream costs.">
  <div class="detail-body compact">
    <p>A 2026 study commissioned by the Ministry of Infrastructure and Water Management estimated the cost of treating pesticide contamination at selected drinking-water abstraction sites.</p>
    <div class="two-col">
      <div>
        <h4>Costs already incurred</h4>
        <div class="figs-dd">
          <div><b>€142.2 million</b><span>Capital invested in additional treatment capacity</span></div>
          <div><b>€14.2 million per year</b><span>Operating cost of that treatment capacity</span></div>
          <div><b>€10 million per year</b><span>Estimated pesticide-related monitoring across the drinking-water sector</span></div>
        </div>
      </div>
      <div>
        <h4>Conditional future scenario</h4>
        <div class="figs-dd">
          <div><b>€993 million</b><span>Additional investment if every site in the study requires activated-carbon treatment</span></div>
          <div><b>€95.6 million per year</b><span>Additional operating cost under the same scenario</span></div>
        </div>
        <p class="dd-kicker" style="margin-top:12px">Conditional scenario · approximately ±40% uncertainty · no implementation date specified</p>
      </div>
    </div>
    <h4>What the figures mean</h4>
    <p>These estimates show the potential economic value of preventing contamination at source. They do not estimate savings from robotic weeding, isolate the effect of one herbicide or represent funding available to the programme.</p>
    <p>For a water board, the primary case is compliance with surface-water standards. Avoided drinking-water treatment is an additional benefit only where the selected agricultural area affects a drinking-water source.</p>
    <div class="warn"><b>Economic question:</b> Is preventing a named herbicide from reaching an affected water source cheaper than managing the resulting compliance and treatment burden?</div>
    <p>A drinking-water company should be considered as a co-funder only where it confirms that the selected area affects one of its sources and that prevention has a measurable economic value.</p>
    <p class="src"><b>Source:</b>&nbsp;<a href="https://open.overheid.nl/overheid/openbaarmakingen/api/v0/attachment/ead8f98d-73ca-465b-8e5c-7c85527b4e23" target="_blank" rel="noopener">Haskoning, Zuiveringskosten bij verdere verontreiniging grondwaterbeschermingsgebieden door bestrijdingsmiddelen, commissioned by the Ministry of Infrastructure and Water Management, February 2026</a></p>
  </div>
</template>

<template id="dd-wur" data-k="Deep dive · the farm" data-h="The Vredepeel trial in detail">
  <div class="detail-body">
    <p>Wageningen Research ran a four-year crop-system experiment (2020 to 2023) on sandy soil at Vredepeel, comparing a conventional reference system with an integrated crop-management system that used fewer crop-protection products. The economic analysis is in the original field report, section 8.1.5 and Table 19, published by BO Akkerbouw.</p>
    <table class="spec-table">
      <tr><th>Measure</th><th>Carrots</th><th>Seed onions</th><th>Note</th></tr>
      <tr><td>Extra labour, integrated vs reference</td><td>+57.8 h/ha</td><td>+29.2 h/ha</td><td>Four-year average, section 8.1.5</td></tr>
      <tr><td>Sales revenue</td><td>−8%</td><td>−15%</td><td>Largely high weed pressure</td></tr>
      <tr><td>Contribution margin per ha, hand-weeding charged to the crop</td><td>−27%</td><td>−39%</td><td>Illustrative, Table 19</td></tr>
      <tr><td>Weighted contribution margin per ha after hand-weeding</td><td colspan="2">−16% across the rotation</td><td>Whole-system result</td></tr>
      <tr><td>Chemicals vs energy</td><td colspan="2">Less spent on chemicals, more on energy</td><td>Mechanical passes replaced sprays</td></tr>
    </table>
    <div class="warn">These are outcomes of one multi-practice field experiment and its economic assumptions. They are not the cost of abandoning all herbicides, a Dutch national average, or a forecast for a robot. For a slide, the extra hours per hectare are the clearest way to show the grower's operational pain.</div>
    <p><b>Figures not used.</b> Supplier pitch material in circulation quotes figures such as 30 to 70% yield loss from uncontrolled weeds, 5% loss when weeds are removed in the critical period, 10 people per hectare for manual weeding, and a 20 to 25% fall in spraying days from climate change. None could be traced to a checkable source or transferred to Dutch carrots or onions. The 5% is a chosen tolerance used to define the critical weed-control window, not a measured outcome. The defensible visual is the WUR trade-off above.</p>
    <p class="src">Sources: Wageningen Research, Integrale aanpak voor de akkerbouw op zand, Rapportage 2020-2023, sections 8.1.5 and Table 19; BO Akkerbouw summary. UMass Extension on the critical period of weed control.</p>
  </div>
</template>

<template id="dd-subsidy" data-k="" data-h="The costs already exist. They sit in different budgets.">
  <div class="detail-body">
    <p>The farmer pays to control weeds and carries the production risk. The water authority funds measures to protect surface water. Drinking-water companies monitor and treat affected sources. These are distinct costs borne by different actors.</p>
    <table class="spec-table two">
      <tr><th>Actor</th><th>Current economic exposure</th></tr>
      <tr><td>Grower</td><td>Pays for weed control and bears the consequences if it is late or ineffective: additional labour, crop damage, lower yield and a larger weed burden in subsequent seasons. The grower ultimately chooses the method used on the field.</td></tr>
      <tr><td>Water authority</td><td>Rijnland has authorised €2.15 million for agricultural soil- and water-quality measures through 2026. Eligible measures include reducing emissions from crop-protection products and mechanical weed control.</td></tr>
      <tr><td>Drinking-water company</td><td>At the groundwater abstraction sites studied, a ministry-commissioned report estimates that drinking-water companies have already invested €142.2 million in additional treatment associated with pesticides and their metabolites. Operating that treatment costs an estimated €14.2 million each year.</td></tr>
    </table>
    <h4>The economic burden is not theoretical</h4>
    <p>Pesticide pressure already produces expenditure inside and outside the farm gate. Farmers pay to protect their crops; water authorities fund preventive measures; and drinking-water companies incur monitoring and treatment costs downstream.</p>
    <div class="warn"><b>Scope of the evidence:</b> The drinking-water figures cover pesticides and metabolites broadly at selected groundwater sites. They are not estimates of herbicide damage, Rijnland's expenditure or the savings achievable through robotic weed control.</div>
    <p class="src"><b>Sources:</b>&nbsp;<a href="https://lokaleregelgeving.overheid.nl/CVDR707423" target="_blank" rel="noopener">Rijnland's official €2.15 million subsidy decision</a><a href="https://open.overheid.nl/details/ead8f98d-73ca-465b-8e5c-7c85527b4e23" target="_blank" rel="noopener">Ministry-commissioned Haskoning study on drinking-water treatment costs</a><a href="https://open.overheid.nl/documenten/a5f9310a-06b8-40a9-a6c6-94095bde1c88/file" target="_blank" rel="noopener">Government-published 2025 evidence on growers' weed-control constraints</a></p>
  </div>
</template>

<template id="dd-intervention" data-k="The intervention" data-h="Conditional, credible demand before the rollout is financed">
  <div class="detail-body">
    <p>The proposed intervention is to create conditional, credible demand for cleaner weed control before the technology companies have financed a full rollout. Farmers, their group or a machinery buyer would buy the service or robots. A water board could be the anchor environmental co-funder: it would reserve an approved contribution toward lower-pollution adoption, conditional on agreed performance and environmental tests. A paid field-validation phase would lead to larger orders if the tests pass. Techleap could assemble the parties, structure the commitment and bring investors into the process when the purchase conditions become underwritable.</p>
    <p><b>One-sentence thesis:</b> Make demand for effective, economic and cleaner weed control concrete enough that Dutch technology companies can finance the transition from field trials to sales.</p>
  </div>
</template>

<template id="dd-grower" data-k="" data-h="The grower's decision: trial trade-off and buying criteria">
  <div class="detail-body">
    <h4>Cost of the lower-input system · one system trial</h4>
    <p>Wageningen's four-year trial at Vredepeel compared a conventional system with a lower-input system using fewer crop-protection products. Weighted across the rotation, the lower-input system's per-hectare contribution margin after hand-weeding was 16% lower than the reference.</p>
    <table class="spec-table">
      <tr><th>Measure</th><th>Carrots</th><th>Seed onions</th></tr>
      <tr><td>Extra labour per hectare per year</td><td>+57.8 hours</td><td>+29.2 hours</td></tr>
      <tr><td>Sales revenue versus the conventional reference</td><td>−8%</td><td>−15%</td></tr>
      <tr><td>Contribution margin per hectare, hand-weeding charged to the crop</td><td>−27%</td><td>−39%</td></tr>
    </table>
    <div class="warn">The trial tested a whole farming system. These numbers are not the impact of laser robots, of every herbicide-free method, or of all Dutch farms. They establish why growers need credible efficacy and economics before changing practice.</div>
    <h4>The grower's buying criteria</h4>
    <ul>
      <li>Weeds controlled at the required stage</li>
      <li>No unacceptable yield or crop damage</li>
      <li>Enough machine capacity in the treatment window</li>
      <li>Predictable cost per treated hectare</li>
    </ul>
    <p class="src"><b>Sources:</b>&nbsp;<a href="https://www.bo-akkerbouw.nl/files/Pdfs-Kennis-en-Innovatie/Integrale-aanpak-voor-de-akkerbouw-op-zand-Rapportage-2020-2023.pdf" target="_blank" rel="noopener">Wageningen Research, Vredepeel report 2020 to 2023, section 8.1.5 and Table 19</a><a href="https://loonbedrijftamminga.nl/prijzen-meststoffen-2026/" target="_blank" rel="noopener">Loonbedrijf Tamminga, 2026 tariffs, veldspuit per hectare</a></p>
  </div>
</template>


<template id="dd-contribution" data-k="" data-h="Set the contribution from farm economics and a conditional buyer offer, not an arbitrary subsidy rate.">
  <div class="detail-body">
    <p>The farmer contribution is determined separately for each target crop and weed-control operation. Four steps.</p>
    <div class="dd-steps">
      <div class="dd-step">
        <span class="dd-n">1</span>
        <h5>Establish the reference case</h5>
        <p class="dd-lead">Independently verify the current method:</p>
        <ul>
          <li>Weed-control cost per hectare</li>
          <li>Yield and crop margin</li>
          <li>Labour requirements</li>
          <li>Number and timing of treatments</li>
        </ul>
      </div>
      <div class="dd-step">
        <span class="dd-n">2</span>
        <h5>Estimate the robotic case before validation</h5>
        <p class="dd-lead">Use existing field evidence, supplier data and conservative assumptions to estimate:</p>
        <ul>
          <li>Weed-control efficacy</li>
          <li>Crop damage and yield</li>
          <li>Hectares treated within the operating window</li>
          <li>Operating, maintenance and labour costs</li>
          <li>Expected useful life and residual value</li>
        </ul>
      </div>
      <div class="dd-step">
        <span class="dd-n">3</span>
        <h5>Calculate what the machine is worth to the farm</h5>
        <div class="dd-eq">
          <div><span>Avoided weed-control costs</span></div>
          <div><i>+</i><span>Evidence-supported additional crop margin</span></div>
          <div><i>−</i><span>Robot operating and transition costs</span></div>
          <div class="res"><i>=</i><span>Gross economic value created</span></div>
          <div><i>−</i><span>Minimum required saving or crop-margin improvement</span></div>
          <div class="res"><i>=</i><span>Maximum economically justified farmer contribution</span></div>
        </div>
        <p class="dd-lead">The minimum required saving is established through farmer interviews. It ensures that adopting the machine creates a genuine financial incentive rather than merely leaving the farmer no worse off. Use present values over an agreed period. Do not rely on unverified yield improvements in the base case.</p>
      </div>
      <div class="dd-step">
        <span class="dd-n">4</span>
        <h5>Confirm what the farmer will pay upfront</h5>
        <p class="dd-lead">Structured farmer interviews establish an initial contribution range, based on willingness to pay and the amount that can be invested without borrowing or weakening farm operations.</p>
        <div class="dd-lower">
          <div><b>Maximum economically justified contribution</b><span>From step 3</span></div>
          <i>Take the lower of</i>
          <div><b>Farmer's binding upfront offer</b><span>Informed by the interviews and confirmed in a signed conditional purchase agreement</span></div>
        </div>
        <p class="dd-lead">The public fund covers the remaining machine price, up to its programme cap. If the combined contributions do not cover the manufacturer's price, the purchase does not proceed.</p>
        <p class="dd-lead">The contribution is agreed conditionally before validation. Independent testing then determines whether the purchase activates.</p>
      </div>
    </div>
    <p><b>The farmer makes an affordable upfront contribution and retains a defined share of the verified economic benefit created by the machine.</b></p>
    <p class="src"><b>Sources:</b>&nbsp;<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10075499/" target="_blank" rel="noopener">Shang et al. 2023, How much can farmers pay for weeding robots?</a> (defines the maximum acquisition value as the machine price at which farm profitability equals that of the current method); <a href="https://www.gov.uk/guidance/advanced-market-commitments-amc" target="_blank" rel="noopener">UK government, Advance Market Commitments guidance</a></p>
  </div>
</template>

<template id="dd-funding" data-k="" data-h="Buyers and public institutions pay for different benefits.">
  <div class="detail-body compact">
    <p>The buyer pays an agreed contribution because the machine creates value for the farm. The public fund covers the remaining price, up to a fixed cap, because reducing herbicide use also benefits water quality.</p>
    <p>No payment is made unless the machine passes independent validation and the combined contributions cover the supplier's price.</p>
    <h4>Who pays</h4>
    <table class="spec-table two narrow"><tr><th>Participant</th><th>Responsibility</th></tr>
      <tr><td>Grower or contractor</td><td>Signs a conditional purchase and pays the agreed contribution at delivery</td></tr>
      <tr><td>Water board</td><td>Reserves a capped contribution and pays it at delivery</td></tr>
      <tr><td>Province</td><td>May provide additional funding under the same conditions</td></tr>
      <tr><td>Technology company</td><td>Sets the price, meets the performance standard and receives the full price at delivery</td></tr>
    </table>
    <h4>How the purchase works</h4>
    <div class="calc-rows four">
      <div><b>1. Reserve public funding</b><span>The water board approves a total programme budget and a maximum contribution per machine.</span></div>
      <div><b>2. Sign conditional purchases</b><span>Buyers commit to defined machine volumes, crops, delivery periods and contributions.</span></div>
      <div><b>3. Validate the machine</b><span>Independent testing measures weed control, crop safety, field capacity, reliability and displacement of the targeted herbicide use.</span></div>
      <div><b>4. Pay at delivery</b><span>If the machine passes and the combined contributions cover its price, the buyer and public programme pay the technology company. Otherwise, the purchase does not proceed.</span></div>
    </div>
    <p>The buyer owns the machine and pays its operating costs. The public contribution is not repaid.</p>
    <h4>Existing Dutch basis</h4>
    <p>Rijnland already subsidises agricultural measures that improve water and soil quality. Eligible productive measures can receive up to 40% of their costs.</p>
    <p>This shows that a water board can support agricultural water-quality measures. It does not automatically authorise this mechanism. A separate or amended funding instrument, and confirmation of procurement and state-aid compliance, would still be required.</p>
    <p class="src"><b>Sources:</b>&nbsp;<a href="https://lokaleregelgeving.overheid.nl/CVDR698620" target="_blank" rel="noopener">Rijnland regulation CVDR698620</a><a href="https://lokaleregelgeving.overheid.nl/CVDR707423" target="_blank" rel="noopener">Rijnland decision CVDR707423</a><a href="https://unievanwaterschappen.nl/waterkwaliteit/" target="_blank" rel="noopener">Unie van Waterschappen, water quality</a></p>
  </div>
</template>

<template id="dd-precedents" data-k="" data-h="Two precedents support different parts of the design.">
  <div class="detail-body compact">
    <p>No existing programme reproduces the proposed Dutch mechanism in full. Gavi shows how funding can be committed before production expands. The UK Sustainable Farming Incentive shows that public money can pay for verified robotic weed control.</p>
    <div class="two-col">
      <div>
        <h4>Gavi: committing demand before production</h4>
        <p>Donors committed US$1.5 billion for future vaccine purchases before manufacturers expanded supply. Suppliers qualified by meeting published requirements and entering long-term supply agreements.</p>
        <p>In 2020, UNICEF contracted a new manufacturer to supply ten million doses annually for ten years at US$2 per dose, 43% below the AMC's original US$3.50 ceiling.</p>
        <h5>What this proves</h5>
        <ul>
          <li>Funding can be reserved before suppliers are selected.</li>
          <li>Requirements can be published in advance.</li>
          <li>Multiple suppliers can qualify.</li>
          <li>Payment can depend on meeting those requirements.</li>
        </ul>
      </div>
      <div>
        <h4>UK scheme: paying for verified use</h4>
        <p>The Sustainable Farming Incentive pays £150 per hectare per year for three years when qualifying robotic or mechanical equipment controls weeds in eligible crops. Participants must retain evidence that the work was completed.</p>
        <h5>What this proves</h5>
        <ul>
          <li>Robotic weed control can qualify for public agricultural funding.</li>
          <li>Payment can depend on verified use.</li>
          <li>Support can be limited by area and time.</li>
        </ul>
      </div>
    </div>
    <h4>How the Dutch proposal differs</h4>
    <p>Gavi used a central buyer. The Dutch programme would involve individual growers and contractors.</p>
    <p>The UK scheme pays for activity, but it does not aggregate future machine purchases or help suppliers finance production.</p>
    <div class="warn"><b>Proposed combination:</b> Buyers sign conditional purchases, public funding is reserved in advance, suppliers set their own prices and purchases activate only after validation.</div>
    <p class="src"><b>Sources:</b>&nbsp;<a href="https://www.gavi.org/news/media-room/pneumonia-vaccine-price-drops-dramatically-lower-income-countries-thanks-gavi" target="_blank" rel="noopener">Gavi, pneumonia vaccine price drop announcement</a><a href="https://www.gavi.org/investing-gavi/innovative-financing/pneumococcal-amc" target="_blank" rel="noopener">Gavi, Pneumococcal AMC</a><a href="https://www.gov.uk/find-funding-for-land-or-farms/prf4-mechanical-robotic-weeding" target="_blank" rel="noopener">Defra, Sustainable Farming Incentive PRF4 mechanical robotic weeding</a></p>
  </div>
</template>

<template id="dd-investor" data-k="" data-h="Conditional purchases give investors evidence of future demand.">
  <div class="detail-body compact">
    <p>The commitments do not remove technical, manufacturing or execution risk. They tell investors who intends to buy, how many machines are required, what conditions must be met and how much public funding is reserved.</p>
    <table class="spec-table two"><tr><th>Before the programme</th><th>With the programme</th></tr>
      <tr><td>General grower interest</td><td>Named buyers and defined machine volumes</td></tr>
      <tr><td>Field demonstrations</td><td>A published validation standard and testing plan</td></tr>
      <tr><td>General public support</td><td>A reserved public budget and maximum contribution</td></tr>
      <tr><td>Supplier sales forecasts</td><td>A production plan linked to conditional purchases</td></tr>
    </table>
    <div class="two-col">
      <div>
        <h4>What each commitment specifies</h4>
        <ul class="cols2">
          <li>Buyer</li><li>Target crop</li><li>Number of machines</li><li>Buyer contribution</li><li>Delivery period</li><li>Validation conditions</li><li>Consequences of passing or failing</li>
        </ul>
        <p>The technology company still sets its own price.</p>
      </div>
      <div>
        <h4>What changes for investors</h4>
        <p>Investors still finance machine construction, validation, working capital and production preparation.</p>
        <p>The programme does not guarantee investment. It allows investors to assess those capital requirements against specified customer demand and reserved public funding, not expressions of interest alone.</p>
      </div>
    </div>
    <p class="src"><b>Sources:</b>&nbsp;<a href="https://techleap.nl/reports/capital-in-deeptech-from-diagnosis-to-action" target="_blank" rel="noopener">Techleap, Capital in deep tech: from diagnosis to action</a><a href="https://www.gavi.org/investing-gavi/innovative-financing/pneumococcal-amc" target="_blank" rel="noopener">Gavi, Pneumococcal AMC</a></p>
  </div>
</template>

<template id="dd-payback" data-k="" data-h="How the payback calculator works">
  <div class="detail-body compact">
    <p>This calculator estimates the payback period for one grower purchasing a light-weeding robot. It compares current weed-control costs with the costs that remain after adoption.</p>
    <h4>Calculation</h4>
    <div class="calc-rows">
      <div><b>Machines required</b><span>Hectares ÷ capacity per machine, rounded up</span></div>
      <div><b>Annual net saving</b><span>Saving per hectare × hectares − annual service costs</span></div>
      <div><b>Payback period</b><span>Total machine purchase price ÷ annual net saving</span></div>
    </div>
    <div class="two-col">
      <div>
        <h4>Default inputs</h4>
        <table class="spec-table"><tr><th>Input</th><th>Default</th><th>Basis</th></tr>
          <tr><td>Machine price</td><td>€115,000</td><td>One supplier's customer model</td></tr>
          <tr><td>Annual service</td><td>€11,000 per machine</td><td>Same supplier model</td></tr>
          <tr><td>Capacity</td><td>225 hectares per season</td><td>Same supplier model</td></tr>
          <tr><td>Herbicide pass</td><td>€70 per hectare</td><td>Assumed application and product cost</td></tr>
        </table>
        <p>The supplier figures were converted from pounds at €1.14 per pound and rounded. Users can change every input.</p>
      </div>
      <div>
        <h4>Important exclusions</h4>
        <ul>
          <li>Yield is assumed to remain unchanged.</li>
          <li>Financing costs and downtime are excluded.</li>
          <li>Residual value is excluded.</li>
          <li>The solar-powered model has no charging cost.</li>
          <li>Operator time is excluded because no public estimate is available.</li>
          <li>Supplier price, service and capacity figures have not been independently verified.</li>
        </ul>
        <p>Unlike the supplier model, this calculator applies service costs every year and allows herbicide passes and hand-weeding to remain after adoption.</p>
      </div>
    </div>
    <h4>Illustrative comparison <i class="lab lab-prop">Assumes the robot replaces all weed-control costs</i></h4>
    <table class="spec-table">
      <tr><th>Current practice</th><th>Cost per hectare</th><th>Payback at 30 hectares</th><th>Payback at 100 hectares</th></tr>
      <tr><td>Herbicide programme</td><td>€210</td><td>No payback: annual saving is below service cost</td><td>11 years</td></tr>
      <tr><td>Organic, transplanted</td><td>€400</td><td>115 years</td><td>4 years</td></tr>
      <tr class="hl"><td>Organic, fine-seeded</td><td>€1,700</td><td>2.9 years</td><td>0.7 years</td></tr>
    </table>
    <div class="two-col">
      <div>
        <h4>What it shows</h4>
        <p>Under these defaults, replacing a relatively inexpensive herbicide programme does not repay the machine. Payback becomes possible where current hand-weeding costs are high.</p>
        <p>The calculation excludes the public value of cleaner water. This is where a temporary public contribution may be justified.</p>
      </div>
      <div>
        <h4>How to use it</h4>
        <p>Use the calculator to identify crops where private demand may already exist and those where public support may be required. It is not a forecast for a specific machine or farm. Replace the defaults with grower invoices and verified field data before making a decision.</p>
      </div>
    </div>
    <p class="src"><b>Sources:</b>&nbsp;<a href="https://loonbedrijftamminga.nl/prijzen-meststoffen-2026/" target="_blank" rel="noopener">Loonbedrijf Tamminga, 2026 tariffs</a><a href="https://www.bo-akkerbouw.nl/files/Pdfs-Kennis-en-Innovatie/Integrale-aanpak-voor-de-akkerbouw-op-zand-Rapportage-2020-2023.pdf" target="_blank" rel="noopener">Wageningen Research, Vredepeel report</a><span class="src-note">Machine price, service, capacity and presets: one supplier's unpublished customer model.</span></p>
  </div>
