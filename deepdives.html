<template id="dd-water-data" data-k="Deep dive · water" data-h="National data and its limits">
  <div class="detail-body">
    <p>The Compendium voor de Leefomgeving (CLO) reports that in 2024, at nearly 80% of sites in the national crop-protection monitoring network, at least one crop-protection chemical exceeded an ecological water-quality standard. The series has improved since the early 2010s, but progress has slowed and the intended reduction has not been achieved. The national series also remains above its target.</p>
    <div class="warn">The 80% figure covers all crop-protection products: herbicides, fungicides, insecticides and their metabolites. Never label it "herbicide contamination", and never imply that any map or figure shows emissions attributable to a robot.</div>
    <p>The weed-control connection becomes concrete at water-board level. Rijnland's corrected 2025 monitoring results identify pendimethalin, a soil herbicide, as a repeated cause of exceedances in bulb-growing and arable areas, and metazachlor as a persistent problem in tree nurseries. Rijnland explains that pendimethalin reaches surface water through spray drift and runoff, and advises careful use or avoidance. The report also notes substitution toward lenacil, which is why the intervention must displace a use rather than shift it to another problematic product. Use the corrected report; the earlier version was amended.</p>
    <p><b>How to demonstrate an environmental result.</b> Pick a catchment and crop where the water authority has identified the herbicide causing exceedances and can link its use to the growers being recruited. Record baseline applications, independently verify which applications the technology actually displaces, and monitor the target compound in nearby ditches or field drains against comparable untreated fields with rainfall data. Count substitute products and rescue sprays. Do not use "litres of pesticide avoided" as a stand-alone measure of ecological benefit.</p>
    <table class="spec-table">
      <tr><th>Actor</th><th>Concrete problem</th><th>Evidence and limits</th></tr>
      <tr><td>Water board</td><td>Protect local surface-water quality; a few problem substances keep a site above its standard.</td><td>Rijnland: continued exceedances, trend too slow for 2027. CLO: national series above target.</td></tr>
      <tr><td>Aquatic ecosystems, downstream users</td><td>Standards protect aquatic organisms. Removing a herbicide from one field removes that field's emissions from that application.</td><td>A plausible causal pathway, not proof that catchment concentration falls by a given percentage. Other fields, practices, weather and chemicals still matter.</td></tr>
      <tr><td>Policymakers</td><td>Environmental goals require improvement while agriculture stays viable.</td><td>Future Vision for Crop Protection 2030: prevent use where possible, near-zero emissions, economic future for growers.</td></tr>
      <tr><td>Drinking-water company</td><td>Monitor source water; run extra treatment at some groundwater intakes when pesticides or metabolites appear.</td><td>Haskoning 2026 for the ministry. Pesticides broadly, selected groundwater sites, not the case herbicide. A different role from the water board.</td></tr>
    </table>
    <p class="src">Sources: CLO indicator nl0547, crop-protection products in surface water 2013 to 2024. Rijnland, correction to news item of 24 March 2026. Landbouwportaal Rijnland on pendimethalin pathways. Unie van Waterschappen on crop-protection chemicals. Links in "Every source on this page".</p>
  </div>
</template>

<template id="dd-bill" data-k="Deep dive · water" data-h="The downstream cost, and the limits of the numbers">
  <div class="detail-body">
    <p>A February 2026 Haskoning study for the Ministry of Infrastructure and Water Management estimates the cost of additional treatment at selected groundwater drinking-water abstraction sites in protection zones, caused by pesticides and their metabolites.</p>
    <table class="spec-table">
      <tr><th>Figure</th><th>What it is</th><th>Status</th></tr>
      <tr><td>€142.2m</td><td>Investment already made in additional treatment at the studied groundwater intakes</td><td>Estimated, historical, ±40%</td></tr>
      <tr><td>€14.2m / year</td><td>Operating cost of that existing treatment</td><td>Estimated, ±40%</td></tr>
      <tr><td>€10m / year</td><td>Pesticide-related drinking-water source monitoring across the sector</td><td>Estimated</td></tr>
      <tr class="hl"><td>€993m</td><td>Additional investment if ongoing pesticide pressure eventually requires extra active-carbon treatment at every site in the study</td><td>Conditional scenario, no date, ±40%</td></tr>
      <tr class="hl"><td>€95.6m / year</td><td>Additional operation in that scenario</td><td>Conditional scenario, ±40%</td></tr>
    </table>
    <div class="warn">These figures concern all pesticides and metabolites at selected groundwater drinking-water sites. The proposed intervention concerns a specified herbicide use in a chosen crop and catchment, measured first against surface-water problems. Different geographies, waters, substances and institutions. Do not label any of them "savings from laser weeding", count them toward the first buyer's budget, or add one-time investment to annual cost. Existing treatment cost would not vanish when one farm changes method.</div>
    <p><b>The economic hypothesis to test</b> is specific: where a named herbicide contributes to a water-quality failure, compare the marginal cost of buying a cleaner replacement upstream with the locally attributable environmental or treatment benefit downstream. A water board's surface-water target can justify a catchment intervention on its own. If the site also protects a groundwater abstraction, ask the drinking-water company directly whether it has a procurement or co-funding interest. Do not infer it from national costs.</p>
    <p class="src">Source: Haskoning, study commissioned by the Ministry of Infrastructure and Water Management, February 2026, sections 2, 4 and 5, Table 4. Listed on open.overheid.nl. Water boards' role: Unie van Waterschappen.</p>
  </div>
</template>

<template id="dd-wur" data-k="Deep dive · the farm" data-h="The Vredepeel trial in detail">
  <div class="detail-body">
    <p>Wageningen Research ran a four-year crop-system experiment (2020 to 2023) on sandy soil at Vredepeel, comparing a conventional reference system with an integrated crop-management system that used fewer crop-protection products. The economic analysis is in the original field report, section 8.1.5 and Table 19, published by BO Akkerbouw.</p>
    <table class="spec-table">
      <tr><th>Measure</th><th>Carrots</th><th>Seed onions</th><th>Note</th></tr>
      <tr><td>Extra labour, integrated vs reference</td><td>+57.8 h/ha</td><td>+29.2 h/ha</td><td>Four-year average, section 8.1.5</td></tr>
      <tr><td>Sales revenue</td><td>−8%</td><td>−15%</td><td>Largely high weed pressure</td></tr>
      <tr><td>Contribution margin per ha, hand-weeding charged to the crop</td><td>−27%</td><td>−39%</td><td>Illustrative, Table 19</td></tr>
      <tr><td>Weighted contribution margin per ha after hand-weeding</td><td colspan="2">−16% across the rotation</td><td>Whole-system result</td></tr>
      <tr><td>Chemicals vs energy</td><td colspan="2">Less spent on chemicals, more on energy</td><td>Mechanical passes replaced sprays</td></tr>
    </table>
    <div class="warn">These are outcomes of one multi-practice field experiment and its economic assumptions. They are not the cost of abandoning all herbicides, a Dutch national average, or a forecast for a robot. For a slide, the extra hours per hectare are the clearest way to show the grower's operational pain.</div>
    <p><b>Figures not used.</b> Supplier pitch material in circulation quotes figures such as 30 to 70% yield loss from uncontrolled weeds, 5% loss when weeds are removed in the critical period, 10 people per hectare for manual weeding, and a 20 to 25% fall in spraying days from climate change. None could be traced to a checkable source or transferred to Dutch carrots or onions. The 5% is a chosen tolerance used to define the critical weed-control window, not a measured outcome. The defensible visual is the WUR trade-off above.</p>
    <p class="src">Sources: Wageningen Research, Integrale aanpak voor de akkerbouw op zand, Rapportage 2020-2023, sections 8.1.5 and Table 19; BO Akkerbouw summary. UMass Extension on the critical period of weed control.</p>
  </div>
</template>

<template id="dd-payback" data-k="Deep dive · the farm" data-h="What the payback calculator assumes">
  <div class="detail-body">
    <p><b>What it is.</b> A simple payback calculation for one light-weeding robot bought by one grower. Payback in years = machine price ÷ (current weeding cost replaced per year − annual service cost).</p>
    <p><b>Where the numbers come from.</b> One supplier's customer model, converted from pounds at 1.14 and rounded: machine price about €115,000; service, maintenance and data about €11,000 per year; capacity 1.5 hectares per 8-hour day over a 150-day season, so about 225 hectares per machine per season. The three presets for current weeding cost are the same model's estimates: a herbicide programme at roughly €60 to €340 per hectare per year, transplanted organic brassica or lettuce at about €400, and fine-seeded organic crops such as salad onion, baby leaf and carrot at about €1,700. None of these is a measured Dutch farm cost.</p>
    <table class="spec-table">
      <tr><th>Current practice</th><th>Cost per ha</th><th>30 ha, after service</th><th>100 ha, after service</th></tr>
      <tr><td>Herbicide programme</td><td>€200</td><td>No payback: €6,000 saving is below €11,000 service</td><td>13 years</td></tr>
      <tr><td>Organic, transplanted</td><td>€400</td><td>115 years</td><td>4 years</td></tr>
      <tr class="hl"><td>Organic, fine-seeded</td><td>€1,700</td><td>2.9 years</td><td>0.7 years</td></tr>
    </table>
    <p><b>What it shows.</b> A grower who controls weeds with herbicide has no financial reason to buy the machine. A grower who pays for hand-weeding often does. The water-quality benefit does not appear in the grower's payback. That is the gap the conditional order and the public contribution are designed to close.</p>
    <div class="warn">Assumptions that make the result optimistic: the robot replaces the chosen share of current weeding cost with no extra labour, energy or downtime; yield is unchanged; no financing cost; no residual value; one machine covers the hectares within the season. The supplier's own sheet adds one year of service to the price and then ignores service in later years, which shortens payback. This calculator charges service every year.</div>
    <p><b>When it makes sense to use.</b> As a screen for which growers have private demand today (organic, fine-seeded crops) and which need a price difference paid by someone else (herbicide users in a target catchment). Not as a forecast for any named machine or farm. Gate 2 replaces the presets with grower invoices; gate 3 replaces the capacity and price with supplier field records.</p>
  </div>
</template>

<template id="dd-subsidy" data-k="Deep dive · signals" data-h="What Rijnland's programme does and does not prove">
  <div class="detail-body">
    <p>Rijnland's 2026 announcement describes coaching and subsidies for agricultural entrepreneurs across more than 30 eligible measures, generally at 40% and sometimes 60% of cost. The official regulation (CVDR698620) covers water and soil quality, water scarcity and flooding, and measures involving crop-protection products, farmyard runoff, soil, banks and freshwater.</p>
    <table class="spec-table">
      <tr><th>Provision</th><th>What it says</th></tr>
      <tr><td>Articles 2 and 6</td><td>Water-quality objective; listed eligible measures. An approved list, not a subsidy for anything that might help water.</td></tr>
      <tr><td>Annex 1</td><td>Mechanical weed-control equipment is one eligible productive measure: 40% of purchase cost, €10,000 cap per measure.</td></tr>
      <tr><td>Article 12</td><td>€10,000 cap per applicant under the crop-protection theme. This cap does not apply across the whole programme.</td></tr>
      <tr><td>Duration</td><td>The present scheme ends 1 January 2027; its successor is undecided.</td></tr>
    </table>
    <p><b>What this proves:</b> policy priority and a water board's concrete funding role across several agricultural water problems. A water board already helps pay for alternatives on farms, one application at a time.</p>
    <p><b>What this suggests:</b> a separate advance-purchase mechanism could take the same public objective and pair a reserved budget with growers' binding conditional orders. A design inference, not a claim that the current scheme can be repurposed without a new approval.</p>
    <div class="warn">What this does not prove: that Rijnland has agreed to participate, that a laser robot qualifies under the current measure list, that the existing cap could cover such a machine, or that a water board can make a new multi-year outcome-payment commitment under this regulation. Vehicle, funding authority, approved budget, state-aid treatment and overlap with existing subsidies all need separate checks.</div>
    <p class="src">Sources: Rijnland, 2026 laatste jaar coaching en subsidies; Landbouwportaal Rijnland subsidy update; regulation CVDR698620 on lokaleregelgeving.overheid.nl.</p>
  </div>
</template>

<template id="dd-routes" data-k="Deep dive · routes" data-h="Three routes, and the crop-location gate">
  <div class="detail-body">
    <table class="spec-table tech">
      <tr><th>Route</th><th>What it does</th><th>Dutch example</th><th>What it might solve</th><th>What remains hard</th></tr>
      <tr><td>Robotic light or laser weeding</td><td>Cameras identify crop and weed; a targeted laser damages the weed at that spot.</td><td>Cropr Weedr, field deployments from 2026; onions, carrots, chicory, witlof, lilies named.</td><td>Remove some herbicide applications; reach weeds near crop plants, subject to crop-specific proof.</td><td>Recognition, speed per hectare, repeated passes, price, uptime, manufacture at scale. Diesel generator specified. Under-€100 per driven hectare is a vendor claim.</td></tr>
      <tr><td>Robotic mechanical removal</td><td>Vision-guided arms or tools physically remove weeds, potentially in the row.</td><td>Odd.Bot Maverick; testing and selling for carrots and onions.</td><td>Chemical-free treatment; potentially fewer hand-weeding hours where it works.</td><td>Soil, crop damage, speed, timing, whether a rescue treatment is still needed. Customer stories are anecdotal.</td></tr>
      <tr><td>Precision spot spraying</td><td>Sensors identify weeds and apply herbicide only where needed.</td><td>Rometron WEED-IT, developed in the Netherlands, sold through dealers.</td><td>Lower input cost and chemical use while keeping an established method.</td><td>Still applies herbicide. Effect on a given pollutant depends on chemical and crop. "Up to" savings are not guaranteed outcomes.</td></tr>
    </table>
    <p><b>Why follow the light robot for discussion.</b> It makes the product-development-to-manufacture gap vivid and gives the audience a concrete investment decision. The intervention itself must remain outcome-based and open to other methods in a real selection. Choosing a robot for a case study must not become a hidden commitment to a supplier or a subsidy for one machine.</p>
    <div class="warn">Crop and location gate. The Vredepeel trial establishes grower cost for carrots and onions. Rijnland identifies pendimethalin exceedances in bulbs and arable areas. Cropr lists witlof; the sectors report a bottleneck in witlof and inulin chicory. These are different pieces of evidence. They do not establish that a particular grower in a particular catchment is using pendimethalin, or that a given robot can replace that exact application. Establish the overlap before naming the launch crop and place. Bulbs and lilies are another possible match, with the same proof needed.</div>
    <p class="src">Sources: Cropr, Odd.Bot, Rometron WEED-IT (vendor sites; performance and cost are vendor claims). Nationale Proeftuin Precisielandbouw 2025 comparison. Deltaplan Agrarisch Waterbeheer and Landbouwportaal Rijnland on mechanical limits.</p>
  </div>
</template>

<template id="dd-precedent" data-k="Deep dive · mechanism" data-h="The Frontier precedent, and what applies here">
  <div class="detail-body">
    <p>Frontier pools buyer spending on future carbon removal. It uses smaller prepurchases for early suppliers and larger offtake contracts for technologies ready to scale. The applicable idea is a buyer commitment made before full supply exists, conditional on later delivery.</p>
    <div class="warn">A verified tonne of carbon removal is easier to standardise than a crop-specific weeding job. The agricultural contract therefore needs much tighter definitions of crop, field conditions, treatment window and success, plus explicit rules for rescue treatments and missed passes. This is an adaptation, not an already proven Dutch farming model.</div>
    <p><b>Hypothetical demonstration, not a forecast.</b> A cluster of growers signs conditional reservations for 300 hectares of one crop; suppliers receive a paid 30-hectare validation slot; the winning supplier's right to supply the remaining eligible hectares activates only if agreed agronomic, price and timing conditions are met. Before presenting 30 or 300 as a real target, establish actual robot capacity, passes, weather window, cost per hectare and whether the buyers can make those commitments. If these cannot be contracted, present the arrangement as a market test rather than an investment-grade order book.</p>
    <p><b>Who operates the machines?</b> Whoever makes the contract work: the startup, a farmer, a dealer, a specialist service company or an agricultural contractor. An intermediary is an optional commercial choice, not the intervention. The core is an enforceable path from technical validation to paid demand and, if the economics justify it, private capital.</p>
    <p class="src">Source: Frontier, frontierclimate.com. Roboltics and Homburg for existing rental and leasing channels the mechanism must add to.</p>
  </div>
</template>

<template id="dd-fit" data-k="Deep dive · mechanism" data-h="Strategic fit and the climate question">
  <div class="detail-body">
    <p>The water problem is large enough to impose real downstream cost, and Techleap's own 2026 deep-tech capital report calls for procurement that builds a route to market. It diagnoses too little market feedback between early public support and later private-investor decisions, and a first-€500k problem. Conditional demand for Dutch agricultural robotics is a concrete test of that scale-up and capital-activation thesis.</p>
    <p>Techleap names Climate Tech as a critical sector. That label alone does not establish that this water-quality intervention meets its sector criteria. The case is primarily about water quality, nature and agricultural technology. Pesticide reduction is not a quantified greenhouse-gas reduction.</p>
    <div class="warn">Any climate claim for a robot needs a comparison of power source, diesel, manufacture, field passes and displaced practices. The Cropr machine specifies a diesel generator; the Wageningen trial recorded higher energy costs as chemical treatments were replaced by mechanical passes. If the audience requires a strict emissions definition of Climate Tech, this case needs a lifecycle assessment or a different sector rationale. Confirm the fit with Techleap while presenting the economic burden and the financing mechanism on their own merits.</div>
    <p class="src">Sources: Techleap deep-tech capital report 2026; techleap.nl sector description; BO Akkerbouw trial summary; Cropr specification.</p>
  </div>
</template>

<template id="dd-model" data-k="Deep dive · explorer" data-h="Model assumptions, and what is missing">
  <div class="detail-body">
    <p>The explorer is arithmetic on stated assumptions. Nothing in it is a measured Dutch farm cost or a supplier quote.</p>
    <table class="spec-table">
      <tr><th>Input</th><th>Default</th><th>Where it comes from</th></tr>
      <tr><td>Hectares under conditional reservation</td><td>300 ha</td><td>The draft's illustrative cluster. Hypothetical.</td></tr>

      <tr><td>Treatments per season</td><td>2</td><td>Assumption. Real value comes from supplier field records and crop agronomy (gate 3).</td></tr>
      <tr><td>Price per driven hectare</td><td>€100</td><td>Anchored on a supplier's under-€100 claim. Vendor claim, not an established farm cost.</td></tr>
      <tr><td>Public contribution to price</td><td>40%</td><td>Equals the rate Rijnland pays on listed measures today. An analogy only: the current scheme is capped at €10,000 per applicant under its crop-protection theme and cannot carry a multi-season order book. A new instrument would need its own approval.</td></tr>

<template id="dd-intervention" data-k="The intervention" data-h="Conditional, credible demand before the rollout is financed">
  <div class="detail-body">
    <p>The proposed intervention is to create conditional, credible demand for cleaner weed control before the technology companies have financed a full rollout. Farmers, their group or a machinery buyer would buy the service or robots. A water board could be the anchor environmental co-funder: it would reserve an approved contribution toward lower-pollution adoption, conditional on agreed performance and environmental tests. A paid field-validation phase would lead to larger orders if the tests pass. Techleap could assemble the parties, structure the commitment and bring investors into the process when the purchase conditions become underwritable.</p>
    <p><b>One-sentence thesis:</b> Make demand for effective, economic and cleaner weed control concrete enough that Dutch technology companies can finance the transition from field trials to sales.</p>
  </div>
</template>
