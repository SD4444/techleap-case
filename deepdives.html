<template id="dd-water-data" data-k="" data-h="">
  <div class="detail-body feature">
    <div class="dd-head">
      <div>
        <p class="eyebrow">Why pesticides in water matter</p>
        <h3 class="dd-title">Pesticide pollution can damage ecosystems and imposes costs beyond the&nbsp;farm.</h3>
      </div>
      <div>
        <p>Herbicides are one class of pesticide. Once these chemicals leave the field, their effects extend beyond the farm.</p>
      </div>
    </div>
    <div class="why-cards">
      <article class="why-card">
        <span class="tag">Aquatic ecosystems</span>
        <p>Water-quality limits protect aquatic plants and animals from acute and chronic exposure. Above these limits, harmful effects can occur.</p>
      </article>
      <article class="why-card">
        <span class="tag">Drinking-water sources</span>
        <p>Surface water and groundwater are used to produce drinking water. Pesticide contamination increases monitoring and treatment needs and can make sources harder to use.</p>
      </article>
      <span class="why-arrow" aria-hidden="true">→</span>
      <article class="why-card">
        <span class="tag">Public responsibility</span>
        <p>When concentrations exceed legal standards, water managers must act. The farm receives the productive benefit, while part of the water-quality cost falls on public institutions and society.</p>
      </article>
    </div>
    <div class="dd-card why-stat">
      <b>Nearly 80%</b>
      <p>of Dutch monitoring sites recorded at least one crop-protection chemical above an ecological standard in 2024.</p>
      <small>This figure covers all crop-protection chemicals, not herbicides alone.</small>
    </div>
    <div class="dd-notes two">
      <div>
        <p class="eyebrow">What the trend shows</p>
        <p>Compared with the 2011 to 2013 baseline, chronic exceedances have fallen by about 45% and acute exceedances by about 65%. Progress on chronic exceedances has largely stalled since 2018, and the 2024 results remain above the policy objective.</p>
      </div>
      <div>
        <p class="eyebrow">Local example: Rijnland regional water authority</p>
        <p>Rijnland is one of the Netherlands' 21 regional water authorities and manages water quality across parts of North and South Holland. Its corrected 2025 results reported repeated exceedances involving the herbicides pendimethalin and metazachlor in agricultural areas. Rijnland identifies spray drift and runoff from treated fields as pathways into surface water.</p>
      </div>
    </div>

    <div class="dd-evidence">
      <p class="eyebrow">Supporting evidence</p>
      <div class="dd-evidence-cols">
        <div>
          <h5>Effects on freshwater ecosystems</h5>
          <p>A 2026 meta-analysis found aquatic plants were the most sensitive group to glyphosate exposure. A separate 2025 river study found pesticide mixtures in water, sediment and aquatic animals, including accumulation in fish and risks from chronic exposure.</p>
          <small class="source">Sources: <a href="https://pubmed.ncbi.nlm.nih.gov/41831893/" target="_blank" rel="noopener">PubMed, 2026 meta-analysis ↗</a> · <a href="https://pubmed.ncbi.nlm.nih.gov/40328359/" target="_blank" rel="noopener">PubMed, 2025 river study ↗</a></small>
        </div>
        <div>
          <h5>Human-health evidence</h5>
          <p>A 2024 systematic review found consistent associations between chronic pesticide exposure and cancers, neurological disorders and endocrine disruption. The strongest evidence concerns occupational and high-intensity exposure.</p>
          <small class="source">Source: <a href="https://pubmed.ncbi.nlm.nih.gov/39717852/" target="_blank" rel="noopener">PubMed, 2024 systematic review ↗</a></small>
        </div>
      </div>
    </div>
    <p class="src"><b>Sources:</b>&nbsp;<a href="https://www.clo.nl/indicatoren/nl054712-gewasbeschermingsmiddelen-in-oppervlaktewater-2013-2024" target="_blank" rel="noopener">CLO, crop-protection products in surface water, 2013 to 2024</a><a href="https://rvs.rivm.nl/onderwerpen/normen/milieu/oppervlaktewater" target="_blank" rel="noopener">RIVM, surface-water quality standards</a><a href="https://www.rivm.nl/drinkwater/drinkwater-en-regelgeving/beschermingsbeleid-drinkwaterbronnen" target="_blank" rel="noopener">RIVM, protection of drinking-water sources</a><a href="https://www.rijnland.net/actueel/nieuwsoverzicht/correctie-op-nieuwsbericht-24-maart-2026/" target="_blank" rel="noopener">Rijnland, corrected 2025 monitoring results</a><a href="https://www.landbouwportaalrijnland.nl/nieuws/zorgvuldig-gebruik-pendimethalin-cruciaal-voor-waterkwaliteit/" target="_blank" rel="noopener">Landbouwportaal Rijnland, pendimethalin and water quality</a></p>

<template id="dd-bill" data-k="" data-h="Pesticide contamination shifts costs downstream.">
  <div class="detail-body compact fc">
    <p class="fc-intro">In February 2026, Haskoning estimated the drinking-water treatment costs associated with continued pesticide use in protected groundwater zones.</p>
    <p class="fc-intro">The study assessed 115 groundwater abstraction sites in protected areas, together representing 49.6% of Dutch drinking-water production capacity.</p>
    <div class="fc-cards bill-cards">
      <article class="fc-card">
        <span class="tag">Additional treatment already installed</span>
        <p>17 sites had already installed an additional treatment stage specifically for pesticide residues. The remaining 98 had not installed this extra treatment.</p>
        <div class="figs-dd">
          <div><b>€142.2 million</b><span>Estimated capital cost of the additional treatment already installed, at 2025 prices.</span></div>
          <div><b>€14.2 million per year</b><span>Estimated annual cost of operating this treatment.</span></div>
        </div>
      </article>
      <article class="fc-card">
        <span class="tag">Modelled future scenario</span>
        <p>To estimate potential future costs, the study assumed that continued pesticide use eventually made additional treatment necessary at all 115 sites. This is a cost scenario, not a forecast.</p>
        <div class="figs-dd">
          <div><b>€993 million</b><span>Estimated additional capital investment under this scenario.</span></div>
          <div><b>€95.6 million per year</b><span>Estimated additional annual treatment cost under this scenario.</span></div>
        </div>
        <p class="dd-def bill-def"><b>Activated-carbon treatment</b><span>Water passes through porous carbon that captures many pesticide residues. The carbon must be regenerated or replaced.</span></p>
      </article>
    </div>
    <p class="dd-foot">All figures are estimates at 2025 prices and carry an uncertainty range of approximately ±40%. The study gives no implementation date, so the second case is a conditional scenario, not a forecast of when these costs will occur.</p>
    <h4>What the study shows</h4>
    <p>The economic issue is a split between who influences the pollution and who bears its cost. Farms influence pesticide use, while drinking-water companies can bear the resulting treatment costs.</p>
    <p>The study shows the possible scale of that burden. It does not attribute these costs to one herbicide or one intervention.</p>
    <p class="src"><b>Source:</b>&nbsp;<a href="https://open.overheid.nl/details/ead8f98d-73ca-465b-8e5c-7c85527b4e23" target="_blank" rel="noopener">Haskoning, <i>Zuiveringskosten bij verdere verontreiniging grondwaterbeschermingsgebieden door bestrijdingsmiddelen</i>, commissioned by the Ministry of Infrastructure and Water Management, 27 February 2026</a></p>
  </div>
</template>

<template id="dd-wur" data-k="Deep dive · the farm" data-h="The Vredepeel trial in detail">
  <div class="detail-body">
    <p>Wageningen Research ran a four-year crop-system experiment (2020 to 2023) on sandy soil at Vredepeel, comparing a conventional reference system with an integrated crop-management system that used fewer crop-protection products. The economic analysis is in the original field report, section 8.1.5 and Table 19, published by BO Akkerbouw.</p>
    <table class="spec-table">
      <tr><th>Measure</th><th>Carrots</th><th>Seed onions</th><th>Note</th></tr>
      <tr><td>Extra labour, integrated vs reference</td><td>+57.8 h/ha</td><td>+29.2 h/ha</td><td>Four-year average, section 8.1.5</td></tr>
      <tr><td>Sales revenue</td><td>−8%</td><td>−15%</td><td>Largely high weed pressure</td></tr>
      <tr><td>Contribution margin per ha, hand-weeding charged to the crop</td><td>−27%</td><td>−39%</td><td>Illustrative, Table 19</td></tr>
      <tr><td>Weighted contribution margin per ha after hand-weeding</td><td colspan="2">−16% across the rotation</td><td>Whole-system result</td></tr>
      <tr><td>Chemicals vs energy</td><td colspan="2">Less spent on chemicals, more on energy</td><td>Mechanical passes replaced sprays</td></tr>
    </table>
    <div class="warn">These are outcomes of one multi-practice field experiment and its economic assumptions. They are not the cost of abandoning all herbicides, a Dutch national average, or a forecast for a robot. For a slide, the extra hours per hectare are the clearest way to show the grower's operational pain.</div>
    <p><b>Figures not used.</b> Supplier pitch material in circulation quotes figures such as 30 to 70% yield loss from uncontrolled weeds, 5% loss when weeds are removed in the critical period, 10 people per hectare for manual weeding, and a 20 to 25% fall in spraying days from climate change. None could be traced to a checkable source or transferred to Dutch carrots or onions. The 5% is a chosen tolerance used to define the critical weed-control window, not a measured outcome. The defensible visual is the WUR trade-off above.</p>
    <p class="src">Sources: Wageningen Research, Integrale aanpak voor de akkerbouw op zand, Rapportage 2020-2023, sections 8.1.5 and Table 19; BO Akkerbouw summary. UMass Extension on the critical period of weed control.</p>
  </div>
</template>

<template id="dd-intervention" data-k="The intervention" data-h="Conditional, credible demand before the rollout is financed">
  <div class="detail-body">
    <p>The proposed intervention is to create conditional, credible demand for cleaner weed control before the technology companies have financed a full rollout. Farmers, their group or a machinery buyer would buy the service or robots. A regional water authority could be the anchor environmental co-funder: it would reserve an approved contribution toward lower-pollution adoption, conditional on agreed performance and environmental tests. A paid field-validation phase would lead to larger orders if the tests pass. Techleap could assemble the parties, structure the commitment and bring investors into the process when the purchase conditions become underwritable.</p>
    <p><b>One-sentence thesis:</b> Make demand for effective, economic and cleaner weed control concrete enough that Dutch technology companies can finance the transition from field trials to sales.</p>
  </div>
</template>

<template id="dd-funding" data-k="" data-h="Buyers and public institutions pay for different benefits.">
  <div class="detail-body compact">
    <p>The buyer contributes because the machine can lower weed-control costs, improve crop margins or both. A regional water authority contributes because lower herbicide use can reduce pesticide pressure on surface water, a benefit that extends beyond the individual farm.</p>
    <div class="benefit-cards">
      <div class="benefit grey"><span class="tag">Private farm benefit</span><b>Paid by the buyer</b><p>Lower weed-control costs and/or higher crop margin.</p></div>
      <div class="benefit green"><span class="tag">Public water-quality benefit</span><b>Paid by the regional water authority, with possible provincial co-funding</b><p>Reduced herbicide use and lower pesticide pressure on surface water.</p></div>
    </div>
    <h4>Existing Dutch basis</h4>
    <p>Rijnland already subsidises agricultural measures that improve water and soil quality. Eligible productive measures can receive up to 40% of their costs.</p>
    <p>This precedent shows that a regional water authority can fund agricultural water-quality measures. It does not automatically authorise this proposed mechanism. The funding instrument, procurement treatment and state-aid compliance would require confirmation.</p>
    <p class="src"><b>Sources:</b>&nbsp;<a href="https://lokaleregelgeving.overheid.nl/CVDR698620" target="_blank" rel="noopener">Rijnland regulation CVDR698620</a><a href="https://lokaleregelgeving.overheid.nl/CVDR707423" target="_blank" rel="noopener">Rijnland decision CVDR707423</a><a href="https://unievanwaterschappen.nl/waterkwaliteit/" target="_blank" rel="noopener">Unie van Waterschappen, water quality</a></p>
  </div>
</template>

<template id="dd-precedents" data-k="" data-h="Three precedents support different parts of the design.">
  <div class="detail-body compact prec">
    <p class="prec-intro">The Gavi Pneumococcal Advance Market Commitment committed donor funding before vaccine production expanded. Frontier's advance market commitment for permanent carbon removal uses future purchase contracts to help suppliers finance capacity. England's Sustainable Farming Incentive pays farmers for verified robotic or mechanical weed control.</p>
    <div class="prec-cards">
      <article class="prec-card">
        <span class="tag">Vaccines, 2009</span>
        <h4>Gavi: committing demand before production</h4>
        <div class="prec-body">
        <p>Donors committed US$1.5 billion for future vaccine purchases before manufacturers expanded supply. Suppliers qualified by meeting published requirements and entering long-term supply agreements.</p>
        <p>In 2020, UNICEF contracted a new manufacturer to supply ten million doses annually for ten years at US$2 per dose, 43% below the AMC's original US$3.50 ceiling.</p>
        </div>
        <div class="prec-fig"><b>US$1.5bn</b><span>committed before supply expanded</span></div>
        <h5>What this proves</h5>
        <ul>
          <li>Funding can be reserved before suppliers are selected.</li>
          <li>Requirements can be published in advance.</li>
          <li>Multiple suppliers can qualify.</li>
          <li>Payment can depend on meeting those requirements.</li>
        </ul>
      </article>
      <article class="prec-card">
        <span class="tag">Carbon removal, 2022</span>
        <h4>Frontier: contracting demand before delivery</h4>
        <div class="prec-body">
        <p>Frontier borrowed its structure from the Gavi Pneumococcal Advance Market Commitment, adapting the model from vaccines to permanent carbon removal.</p>
        <p>Frontier aggregates commitments from corporate buyers and enters supplier-specific prepurchase or pay-on-delivery offtake agreements for future carbon removal. These agreements create contracted future demand that suppliers can use when raising capital to build delivery capacity.</p>
        </div>
        <div class="prec-fig"><b>Offtake</b><span>purchase contracted before delivery</span></div>
        <h5>What this proves</h5>
        <ul>
          <li>Buyers can commit before supply is delivered.</li>
          <li>Supplier-specific future purchase agreements can support financing.</li>
          <li>Payment can remain conditional on verified delivery.</li>
        </ul>
      </article>
      <article class="prec-card">
        <span class="tag">Robotic weeding, UK</span>
        <h4>UK scheme: paying for verified use</h4>
        <div class="prec-body">
        <p>The Sustainable Farming Incentive pays £150 per hectare per year for three years when qualifying robotic or mechanical equipment controls weeds in eligible crops. Participants must retain evidence that the work was completed.</p>
        </div>
        <div class="prec-fig"><b>£150/ha</b><span>per year, for three years</span></div>
        <h5>What this proves</h5>
        <ul>
          <li>Robotic weed control can qualify for public agricultural funding.</li>
          <li>Payment can depend on verified use.</li>
          <li>Support can be limited by area and time.</li>
        </ul>
      </article>
    </div>
    <div class="dd-summary">
      <div class="dd-summary-head">
        <span class="tag">Summary</span>
        <h4>How the Dutch proposal differs</h4>
      </div>
      <div class="dd-summary-body">
      <p>Gavi used donor funding and central procurement for vaccines. Frontier aggregates corporate demand for carbon removal. The UK scheme pays farmers for verified activity.</p>
      <p>The Dutch proposal would combine conditional machine purchases from growers and contractors with a public contribution for the water-quality benefit. Suppliers would set their own prices and raise the capital required to build and validate the machines.</p>
      <p class="dd-summary-key">Frontier provides the closest financing precedent: future purchases are contracted before delivery so suppliers can finance the capacity required to fulfil them.</p>
      </div>
    </div>
    <p class="src"><b>Sources:</b>&nbsp;<a href="https://www.gavi.org/news/media-room/pneumonia-vaccine-price-drops-dramatically-lower-income-countries-thanks-gavi" target="_blank" rel="noopener">Gavi, pneumonia vaccine price drop announcement</a><a href="https://www.gavi.org/investing-gavi/innovative-financing/pneumococcal-amc" target="_blank" rel="noopener">Gavi, Pneumococcal AMC</a><a href="https://www.gov.uk/find-funding-for-land-or-farms/prf4-mechanical-robotic-weeding" target="_blank" rel="noopener">Defra, Sustainable Farming Incentive PRF4 mechanical robotic weeding</a><a href="https://frontierclimate.com/" target="_blank" rel="noopener">Frontier, advance market commitment for carbon removal</a><a href="https://frontierclimate.com/writing/launch" target="_blank" rel="noopener">Frontier, launch announcement</a><a href="https://frontierclimate.com/apply/offtake" target="_blank" rel="noopener">Frontier, offtake agreements</a><a href="https://frontierclimate.com/writing/first-offtake" target="_blank" rel="noopener">Frontier, first offtake agreements</a></p>
  </div>
</template>

<template id="dd-stimulation" data-k="" data-h="Two mechanisms bring capital forward before full validation.">
  <div class="detail-body compact fc">
    <p class="fc-intro">New technologies often need substantial capital to build and test before customers are ready to buy. The United States uses several mechanisms to bridge this period. Two are shown here. Each addresses a different risk.</p>
    <div class="mech-cards two">
      <article class="mech-card">
        <span class="tag">DARPA Subterranean Challenge</span>
        <p class="mech-kind">Prize competition</p>
        <p class="mech-body">DARPA defined a difficult mission, created realistic test environments and allowed funded and self-funded teams to compete against objective performance measures.</p>
        <div class="mech-block"><h5>What it stimulates</h5><p>Advances in autonomy, sensing, communications and multi-robot performance.</p></div>
        <div class="mech-block"><h5>Capital effect</h5><p>Funding, prizes and independent results reduce technical uncertainty and can strengthen a company's credibility. They do not guarantee procurement or create a commercial market.</p></div>
      </article>
      <article class="mech-card">
        <span class="tag">Air Force Collaborative Combat Aircraft</span>
        <p class="mech-kind">Funded development contracts</p>
        <p class="mech-body">The Air Force funded selected companies to design, build and test production-representative aircraft before choosing production suppliers. Production remained a later competition.</p>
        <div class="mech-block"><h5>What it stimulates</h5><p>Real hardware and flight testing before the final procurement decision.</p></div>
        <div class="mech-block"><h5>Capital effect</h5><p>Government contracts directly fund development and validation. A credible procurement path also gives companies and private investors a reason to invest alongside the programme.</p></div>
      </article>
    </div>
    <div class="dd-summary">
      <div class="dd-summary-head">
        <span class="tag">Conclusion</span>
        <h4>What this means for clean weeding</h4>
      </div>
      <div class="dd-summary-body">
      <p>The programme should not wait for fully proven machines and then look for buyers. It should define the test and secure conditional farmer and public commitments before full validation. Technology companies can then use those commitments to raise the capital needed to build machines and complete field trials. Payment follows qualification and delivery.</p>
      <p class="dd-summary-small">The commitments reduce demand risk. Technology companies and investors still carry development, manufacturing and execution risk.</p>
      </div>
    </div>
    <p class="src"><b>Sources:</b>&nbsp;<a href="https://www.darpa.mil/news/2020/subterranean-challenge-qualified-teams" target="_blank" rel="noopener">DARPA Subterranean Challenge</a><a href="https://www.af.mil/News/Article-Display/Article/3754980/air-force-exercises-two-collaborative-combat-aircraft-option-awards/" target="_blank" rel="noopener">US Air Force Collaborative Combat Aircraft</a></p>
  </div>
</template>

<template id="dd-investor" data-k="" data-h="Conditional purchases reduce three sources of commercial risk.">
  <div class="detail-body compact fc">
    <p class="fc-intro">Before capital is committed, investors can see who has agreed to buy, how the purchase price will be covered and what conditions activate payment.</p>
    <div class="risk-cards">
      <article class="risk-card">
        <span class="tag">Demand risk</span>
        <p>Named buyers commit to specific machine volumes.</p>
      </article>
      <article class="risk-card">
        <span class="tag">Payment risk</span>
        <p>Buyer and public contributions are agreed in advance and cover the purchase price.</p>
      </article>
      <article class="risk-card">
        <span class="tag">Acceptance risk</span>
        <p>The conditions that trigger payment are defined before investment.</p>
      </article>
    </div>
    <div class="fc-strip">
      <p>With these commercial conditions defined, investors can focus on whether the company can build, validate and deliver the machines.</p>
    </div>
    <p class="src"><b>Sources:</b>&nbsp;<a href="https://techleap.nl/reports/capital-in-deeptech-from-diagnosis-to-action" target="_blank" rel="noopener">Techleap, Capital in deep tech: from diagnosis to action</a><a href="https://www.gavi.org/investing-gavi/innovative-financing/pneumococcal-amc" target="_blank" rel="noopener">Gavi, Pneumococcal AMC</a></p>
  </div>
</template>
