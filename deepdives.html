<template id="dd-water-data" data-k="" data-h="">
  <div class="detail-body feature">
    <div class="dd-head">
      <div>
        <p class="eyebrow">What national monitoring found</p>
        <h3 class="dd-title">Nearly 80% of monitoring sites exceeded a standard for crop&#8209;protection&nbsp;chemicals.</h3>
      </div>
      <div>
        <p>A location counts as exceeding when at least one monitored substance breaches either:</p>
        <ul>
          <li>the chronic-exposure standard, based on its average concentration over the year; or</li>
          <li>the acute-exposure standard, based on the highest concentration measured during the year.</li>
        </ul>
      </div>
    </div>
    <div class="dd-card">
      <div class="dd-card-head"><p class="eyebrow">Exceedances since 2011 to 2013</p><i class="lab lab-obs">National monitoring network, 2024</i></div>
      <div class="dd-figs">
        <div><b>80%</b><span>Monitoring sites with at least one substance above a standard in 2024</span></div>
        <div><b>−45%</b><span>Chronic-exposure exceedances since 2011 to 2013</span></div>
        <div><b>−65%</b><span>Acute-exposure exceedances since 2011 to 2013</span></div>
      </div>
      <p class="dd-card-note">The highest combined exceedances occur around tree nurseries, arable farms, flower-bulb fields and greenhouses.</p>
    </div>
    <div class="dd-notes">
      <div>
        <p class="eyebrow">What the trend shows</p>
        <p>However, progress on chronic exceedances has largely stalled since 2018, and the 2024 results remain well above the policy objective. The national data identifies where risks are concentrated, but it does not attribute an individual exceedance to a specific farm.</p>
      </div>
      <div>
        <p class="eyebrow">A local example: Rijnland</p>
        <p>Rijnland, one of the Netherlands' 21 regional water authorities, has repeatedly detected the herbicides pendimethalin and metazachlor in agricultural areas. It identifies spray drift and runoff from treated fields as pathways into surface water.</p>
      </div>
      <div>
        <p class="eyebrow">What regional monitoring can show</p>
        <p>Regional monitoring can therefore identify the substances and locations requiring closer investigation. It does not, by itself, prove which individual farm caused a measured exceedance.</p>
      </div>
    </div>
    <p class="src"><b>Sources:</b>&nbsp;<a href="https://www.clo.nl/indicatoren/nl054712-gewasbeschermingsmiddelen-in-oppervlaktewater-2013-2024" target="_blank" rel="noopener">CLO, crop-protection products in surface water, 2013 to 2024</a><a href="https://www.rijnland.net/actueel/nieuwsoverzicht/correctie-op-nieuwsbericht-24-maart-2026/" target="_blank" rel="noopener">Rijnland, corrected 2025 monitoring results</a><a href="https://www.landbouwportaalrijnland.nl/nieuws/zorgvuldig-gebruik-pendimethalin-cruciaal-voor-waterkwaliteit/" target="_blank" rel="noopener">Landbouwportaal Rijnland, pendimethalin and water quality</a><a href="https://www.rijnland.net/about-rijnland-eng/" target="_blank" rel="noopener">Rijnland Regional Water Authority, About Rijnland</a></p>
  </div>
</template>

<template id="dd-bill" data-k="" data-h="Pesticide pollution can create large downstream costs.">
  <div class="detail-body compact">
    <p>A 2026 study commissioned by the Ministry of Infrastructure and Water Management estimated the cost of treating pesticide contamination at selected drinking-water abstraction sites.</p>
    <div class="two-col">
      <div>
        <h4>Costs already incurred</h4>
        <div class="figs-dd">
          <div><b>€142.2 million</b><span>Capital invested in additional treatment capacity</span></div>
          <div><b>€14.2 million per year</b><span>Operating cost of that treatment capacity</span></div>
          <div><b>€10 million per year</b><span>Estimated pesticide-related monitoring across the drinking-water sector</span></div>
        </div>
      </div>
      <div>
        <h4>Conditional future scenario</h4>
        <div class="figs-dd">
          <div><b>€993 million</b><span>Additional investment if every site in the study requires activated-carbon treatment</span></div>
          <div><b>€95.6 million per year</b><span>Additional operating cost under the same scenario</span></div>
        </div>
        <p class="dd-kicker" style="margin-top:12px">Conditional scenario · approximately ±40% uncertainty · no implementation date specified</p>
      </div>
    </div>
    <h4>What the figures mean</h4>
    <p>These estimates show the potential economic value of preventing contamination at source. They do not estimate savings from robotic weeding, isolate the effect of one herbicide or represent funding available to the programme.</p>
    <p>For a regional water authority, the primary case is compliance with surface-water standards. Avoided drinking-water treatment is an additional benefit only where the selected agricultural area affects a drinking-water source.</p>
    <div class="warn"><b>Economic question:</b> Is preventing a named herbicide from reaching an affected water source cheaper than managing the resulting compliance and treatment burden?</div>
    <p>A drinking-water company should be considered as a co-funder only where it confirms that the selected area affects one of its sources and that prevention has a measurable economic value.</p>
    <p class="src"><b>Source:</b>&nbsp;<a href="https://open.overheid.nl/overheid/openbaarmakingen/api/v0/attachment/ead8f98d-73ca-465b-8e5c-7c85527b4e23" target="_blank" rel="noopener">Haskoning, Zuiveringskosten bij verdere verontreiniging grondwaterbeschermingsgebieden door bestrijdingsmiddelen, commissioned by the Ministry of Infrastructure and Water Management, February 2026</a></p>
  </div>
</template>

<template id="dd-wur" data-k="Deep dive · the farm" data-h="The Vredepeel trial in detail">
  <div class="detail-body">
    <p>Wageningen Research ran a four-year crop-system experiment (2020 to 2023) on sandy soil at Vredepeel, comparing a conventional reference system with an integrated crop-management system that used fewer crop-protection products. The economic analysis is in the original field report, section 8.1.5 and Table 19, published by BO Akkerbouw.</p>
    <table class="spec-table">
      <tr><th>Measure</th><th>Carrots</th><th>Seed onions</th><th>Note</th></tr>
      <tr><td>Extra labour, integrated vs reference</td><td>+57.8 h/ha</td><td>+29.2 h/ha</td><td>Four-year average, section 8.1.5</td></tr>
      <tr><td>Sales revenue</td><td>−8%</td><td>−15%</td><td>Largely high weed pressure</td></tr>
      <tr><td>Contribution margin per ha, hand-weeding charged to the crop</td><td>−27%</td><td>−39%</td><td>Illustrative, Table 19</td></tr>
      <tr><td>Weighted contribution margin per ha after hand-weeding</td><td colspan="2">−16% across the rotation</td><td>Whole-system result</td></tr>
      <tr><td>Chemicals vs energy</td><td colspan="2">Less spent on chemicals, more on energy</td><td>Mechanical passes replaced sprays</td></tr>
    </table>
    <div class="warn">These are outcomes of one multi-practice field experiment and its economic assumptions. They are not the cost of abandoning all herbicides, a Dutch national average, or a forecast for a robot. For a slide, the extra hours per hectare are the clearest way to show the grower's operational pain.</div>
    <p><b>Figures not used.</b> Supplier pitch material in circulation quotes figures such as 30 to 70% yield loss from uncontrolled weeds, 5% loss when weeds are removed in the critical period, 10 people per hectare for manual weeding, and a 20 to 25% fall in spraying days from climate change. None could be traced to a checkable source or transferred to Dutch carrots or onions. The 5% is a chosen tolerance used to define the critical weed-control window, not a measured outcome. The defensible visual is the WUR trade-off above.</p>
    <p class="src">Sources: Wageningen Research, Integrale aanpak voor de akkerbouw op zand, Rapportage 2020-2023, sections 8.1.5 and Table 19; BO Akkerbouw summary. UMass Extension on the critical period of weed control.</p>
  </div>
</template>

<template id="dd-intervention" data-k="The intervention" data-h="Conditional, credible demand before the rollout is financed">
  <div class="detail-body">
    <p>The proposed intervention is to create conditional, credible demand for cleaner weed control before the technology companies have financed a full rollout. Farmers, their group or a machinery buyer would buy the service or robots. A regional water authority could be the anchor environmental co-funder: it would reserve an approved contribution toward lower-pollution adoption, conditional on agreed performance and environmental tests. A paid field-validation phase would lead to larger orders if the tests pass. Techleap could assemble the parties, structure the commitment and bring investors into the process when the purchase conditions become underwritable.</p>
    <p><b>One-sentence thesis:</b> Make demand for effective, economic and cleaner weed control concrete enough that Dutch technology companies can finance the transition from field trials to sales.</p>
  </div>
</template>

<template id="dd-contribution" data-k="" data-h="How the farmer's contribution is set.">
  <div class="detail-body compact fc">
    <p class="fc-intro">For each crop and weed-control operation, the farmer's contribution is agreed before validation using two limits.</p>
    <div class="fc-cards">
      <article class="fc-card">
        <span class="tag">Economic ceiling</span>
        <div class="fc-body">
        <p>Estimate the value created by switching over an agreed period:</p>
        <ul>
          <li>Avoided current weed-control costs</li>
          <li>Plus evidence-supported crop-margin improvement</li>
          <li>Minus robot operating and transition costs</li>
          <li>Minus the minimum benefit retained by the farmer</li>
        </ul>
        </div>
        <p class="fc-result"><b>Result:</b> Maximum economically justified contribution</p>
        <p class="fc-note">Use conservative, evidence-supported assumptions until validation provides actual results.</p>
      </article>
      <article class="fc-card">
        <span class="tag">Signed farmer offer</span>
        <div class="fc-body">
        <p>Structured interviews establish a realistic contribution range. The farmer then signs a conditional offer stating what they will pay at delivery if the machine passes validation.</p>
        </div>
        <p class="fc-result"><b>Result:</b> Maximum amount the farmer will commit</p>
      </article>
    </div>
    <div class="fc-calc">
      <span class="fc-term">Farmer contribution</span>
      <i>=</i>
      <span class="fc-term">the lower of</span>
      <span class="fc-box">the economic ceiling</span>
      <span class="fc-term">and</span>
      <span class="fc-box">the signed offer</span>
    </div>
    <div class="fc-strip">
      <p>The public fund covers the remaining machine price, up to its programme cap. If the combined contributions do not cover the price, the purchase does not proceed.</p>
    </div>
    <p class="fc-final">The contribution is agreed before validation and paid only after the machine passes and is delivered.</p>
    <p class="src"><b>Sources:</b>&nbsp;<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10075499/" target="_blank" rel="noopener">Shang et al. 2023, How much can farmers pay for weeding robots?</a> (defines the maximum acquisition value as the machine price at which farm profitability equals that of the current method); <a href="https://www.gov.uk/guidance/advanced-market-commitments-amc" target="_blank" rel="noopener">UK government, Advance Market Commitments guidance</a></p>
  </div>
</template>

<template id="dd-funding" data-k="" data-h="Buyers and public institutions pay for different benefits.">
  <div class="detail-body compact">
    <p>The buyer contributes because the machine can lower weed-control costs, improve crop margins or both. A regional water authority contributes because lower herbicide use can reduce pesticide pressure on surface water, a benefit that extends beyond the individual farm.</p>
    <div class="benefit-cards">
      <div class="benefit grey"><span class="tag">Private farm benefit</span><b>Paid by the buyer</b><p>Lower weed-control costs and/or higher crop margin.</p></div>
      <div class="benefit green"><span class="tag">Public water-quality benefit</span><b>Paid by the regional water authority, with possible provincial co-funding</b><p>Reduced herbicide use and lower pesticide pressure on surface water.</p></div>
    </div>
    <h4>Existing Dutch basis</h4>
    <p>Rijnland already subsidises agricultural measures that improve water and soil quality. Eligible productive measures can receive up to 40% of their costs.</p>
    <p>This precedent shows that a regional water authority can fund agricultural water-quality measures. It does not automatically authorise this proposed mechanism. The funding instrument, procurement treatment and state-aid compliance would require confirmation.</p>
    <p class="src"><b>Sources:</b>&nbsp;<a href="https://lokaleregelgeving.overheid.nl/CVDR698620" target="_blank" rel="noopener">Rijnland regulation CVDR698620</a><a href="https://lokaleregelgeving.overheid.nl/CVDR707423" target="_blank" rel="noopener">Rijnland decision CVDR707423</a><a href="https://unievanwaterschappen.nl/waterkwaliteit/" target="_blank" rel="noopener">Unie van Waterschappen, water quality</a></p>
  </div>
</template>

<template id="dd-precedents" data-k="" data-h="Three precedents support different parts of the design.">
  <div class="detail-body compact prec">
    <p class="prec-intro">No existing programme reproduces the proposed Dutch mechanism in full. Gavi shows how public funding can be committed before production expands. Frontier shows how contracted future demand can support supplier financing before delivery. The UK Sustainable Farming Incentive shows that public money can pay for verified robotic weed control.</p>
    <div class="prec-cards">
      <article class="prec-card">
        <span class="tag">Vaccines, 2009</span>
        <h4>Gavi: committing demand before production</h4>
        <div class="prec-body">
        <p>Donors committed US$1.5 billion for future vaccine purchases before manufacturers expanded supply. Suppliers qualified by meeting published requirements and entering long-term supply agreements.</p>
        <p>In 2020, UNICEF contracted a new manufacturer to supply ten million doses annually for ten years at US$2 per dose, 43% below the AMC's original US$3.50 ceiling.</p>
        </div>
        <div class="prec-fig"><b>US$1.5bn</b><span>committed before supply expanded</span></div>
        <h5>What this proves</h5>
        <ul>
          <li>Funding can be reserved before suppliers are selected.</li>
          <li>Requirements can be published in advance.</li>
          <li>Multiple suppliers can qualify.</li>
          <li>Payment can depend on meeting those requirements.</li>
        </ul>
      </article>
      <article class="prec-card">
        <span class="tag">Carbon removal, 2022</span>
        <h4>Frontier: contracting demand before delivery</h4>
        <div class="prec-body">
        <p>Frontier aggregates commitments from corporate buyers and enters supplier-specific prepurchase or pay-on-delivery offtake agreements for future carbon removal. These agreements create contracted future demand that suppliers can use when raising capital to build delivery capacity.</p>
        </div>
        <div class="prec-fig"><b>Offtake</b><span>purchase contracted before delivery</span></div>
        <h5>What this proves</h5>
        <ul>
          <li>Buyers can commit before supply is delivered.</li>
          <li>Supplier-specific future purchase agreements can support financing.</li>
          <li>Payment can remain conditional on verified delivery.</li>
        </ul>
      </article>
      <article class="prec-card">
        <span class="tag">Robotic weeding, UK</span>
        <h4>UK scheme: paying for verified use</h4>
        <div class="prec-body">
        <p>The Sustainable Farming Incentive pays £150 per hectare per year for three years when qualifying robotic or mechanical equipment controls weeds in eligible crops. Participants must retain evidence that the work was completed.</p>
        </div>
        <div class="prec-fig"><b>£150/ha</b><span>per year, for three years</span></div>
        <h5>What this proves</h5>
        <ul>
          <li>Robotic weed control can qualify for public agricultural funding.</li>
          <li>Payment can depend on verified use.</li>
          <li>Support can be limited by area and time.</li>
        </ul>
      </article>
    </div>
    <div class="dd-summary">
      <div class="dd-summary-head">
        <span class="tag">Summary</span>
        <h4>How the Dutch proposal differs</h4>
      </div>
      <div class="dd-summary-body">
      <p>Gavi used donor funding and central procurement for vaccines. Frontier aggregates corporate demand for carbon removal. The UK scheme pays farmers for verified activity.</p>
      <p>The Dutch proposal would combine conditional machine purchases from growers and contractors with a public contribution for the water-quality benefit. Suppliers would set their own prices and raise the capital required to build and validate the machines.</p>
      <p class="dd-summary-key">Frontier provides the closest financing precedent: future purchases are contracted before delivery so suppliers can finance the capacity required to fulfil them.</p>
      </div>
    </div>
    <p class="src"><b>Sources:</b>&nbsp;<a href="https://www.gavi.org/news/media-room/pneumonia-vaccine-price-drops-dramatically-lower-income-countries-thanks-gavi" target="_blank" rel="noopener">Gavi, pneumonia vaccine price drop announcement</a><a href="https://www.gavi.org/investing-gavi/innovative-financing/pneumococcal-amc" target="_blank" rel="noopener">Gavi, Pneumococcal AMC</a><a href="https://www.gov.uk/find-funding-for-land-or-farms/prf4-mechanical-robotic-weeding" target="_blank" rel="noopener">Defra, Sustainable Farming Incentive PRF4 mechanical robotic weeding</a><a href="https://frontierclimate.com/" target="_blank" rel="noopener">Frontier, advance market commitment for carbon removal</a><a href="https://frontierclimate.com/writing/launch" target="_blank" rel="noopener">Frontier, launch announcement</a><a href="https://frontierclimate.com/apply/offtake" target="_blank" rel="noopener">Frontier, offtake agreements</a><a href="https://frontierclimate.com/writing/first-offtake" target="_blank" rel="noopener">Frontier, first offtake agreements</a></p>
  </div>
</template>

<template id="dd-investor" data-k="" data-h="Conditional purchases give investors evidence of future demand.">
  <div class="detail-body compact">
    <p>The commitments do not remove technical, manufacturing or execution risk. They tell investors who intends to buy, how many machines are required, what conditions must be met and how much public funding is reserved.</p>
    <table class="spec-table two"><tr><th>Before the programme</th><th>With the programme</th></tr>
      <tr><td>General grower interest</td><td>Named buyers and defined machine volumes</td></tr>
      <tr><td>Field demonstrations</td><td>A published validation standard and testing plan</td></tr>
      <tr><td>General public support</td><td>A reserved public budget and maximum contribution</td></tr>
      <tr><td>Supplier sales forecasts</td><td>A production plan linked to conditional purchases</td></tr>
    </table>
    <div class="two-col">
      <div>
        <h4>What each commitment specifies</h4>
        <ul class="cols2">
          <li>Buyer</li><li>Target crop</li><li>Number of machines</li><li>Buyer contribution</li><li>Delivery period</li><li>Validation conditions</li><li>Consequences of passing or failing</li>
        </ul>
        <p>The technology company still sets its own price.</p>
      </div>
      <div>
        <h4>What changes for investors</h4>
        <p>Investors still finance machine construction, validation, working capital and production preparation.</p>
        <p>The programme does not guarantee investment. It allows investors to assess those capital requirements against specified customer demand and reserved public funding, not expressions of interest alone.</p>
      </div>
    </div>
    <p class="src"><b>Sources:</b>&nbsp;<a href="https://techleap.nl/reports/capital-in-deeptech-from-diagnosis-to-action" target="_blank" rel="noopener">Techleap, Capital in deep tech: from diagnosis to action</a><a href="https://www.gavi.org/investing-gavi/innovative-financing/pneumococcal-amc" target="_blank" rel="noopener">Gavi, Pneumococcal AMC</a></p>
  </div>
</template>

<template id="dd-payback" data-k="" data-h="How the payback calculator works">
  <div class="detail-body compact">
    <p>This calculator estimates the payback period for one grower purchasing a light-weeding robot. It compares current weed-control costs with the costs that remain after adoption.</p>
    <h4>Calculation</h4>
    <div class="calc-rows">
      <div><b>Machines required</b><span>Hectares ÷ capacity per machine, rounded up</span></div>
      <div><b>Annual net saving</b><span>Saving per hectare × hectares − annual service costs</span></div>
      <div><b>Payback period</b><span>Total machine purchase price ÷ annual net saving</span></div>
    </div>
    <div class="two-col">
      <div>
        <h4>Default inputs</h4>
        <table class="spec-table"><tr><th>Input</th><th>Default</th><th>Basis</th></tr>
          <tr><td>Machine price</td><td>€115,000</td><td>One supplier's customer model</td></tr>
          <tr><td>Annual service</td><td>€11,000 per machine</td><td>Same supplier model</td></tr>
          <tr><td>Capacity</td><td>225 hectares per season</td><td>Same supplier model</td></tr>
          <tr><td>Herbicide pass</td><td>€70 per hectare</td><td>Assumed application and product cost</td></tr>
        </table>
        <p>The supplier figures were converted from pounds at €1.14 per pound and rounded. Users can change every input.</p>
      </div>
      <div>
        <h4>Important exclusions</h4>
        <ul>
          <li>Yield is assumed to remain unchanged.</li>
          <li>Financing costs and downtime are excluded.</li>
          <li>Residual value is excluded.</li>
          <li>The solar-powered model has no charging cost.</li>
          <li>Operator time is excluded because no public estimate is available.</li>
          <li>Supplier price, service and capacity figures have not been independently verified.</li>
        </ul>
        <p>Unlike the supplier model, this calculator applies service costs every year and allows herbicide passes and hand-weeding to remain after adoption.</p>
      </div>

    <h4>Illustrative comparison <i class="lab lab-prop">Assumes the robot replaces all weed-control costs</i></h4>
    <table class="spec-table">
      <tr><th>Current practice</th><th>Cost per hectare</th><th>Payback at 30 hectares</th><th>Payback at 100 hectares</th></tr>

    <div class="two-col">
      <div>
        <h4>What it shows</h4>
        <p>Under these defaults, replacing a relatively inexpensive herbicide programme does not repay the machine. Payback becomes possible where current hand-weeding costs are high.</p>
        <p>The calculation excludes the public value of cleaner water. This is where a temporary public contribution may be justified.</p>
      </div>
      <div>
        <h4>How to use it</h4>
        <p>Use the calculator to identify crops where private demand may already exist and those where public support may be required. It is not a forecast for a specific machine or farm. Replace the defaults with grower invoices and verified field data before making a decision.</p>
