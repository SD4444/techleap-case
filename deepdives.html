<template id="dd-water-data" data-k="" data-h="From national evidence to a local intervention">
  <div class="detail-body">
    <p>National monitoring establishes the scale of the water-quality problem. In 2024, nearly 80% of locations in the Dutch crop-protection monitoring network recorded at least one substance above an ecological water-quality standard. Exceedances have declined substantially since the early 2010s, but the rate of improvement has slowed and the intended reduction has not been achieved.</p>
    <p>This national indicator covers the full range of crop-protection products, including herbicides, fungicides, insecticides and their metabolites. It therefore demonstrates a widespread water-quality challenge, but does not isolate the contribution of herbicides or identify the crops and fields responsible for individual exceedances.</p>
    <div class="warn"><b>Interpretation:</b> National data establishes the materiality of the problem. A credible intervention must then connect a specific substance, crop and catchment to a technology capable of displacing that particular use.</div>
    <h4>Establishing the local causal pathway</h4>
    <p>Rijnland's corrected 2025 monitoring results provide a more specific connection to weed control. Pendimethalin, a soil herbicide, repeatedly exceeded standards in bulb-growing and arable areas, while metazachlor remained a persistent problem around tree nurseries. Rijnland identifies spray drift and runoff from treated fields as pathways through which pendimethalin reaches surface water.</p>
    <p>However, eliminating one substance does not necessarily eliminate the environmental burden. Rijnland also observed substitution towards lenacil. The relevant outcome is therefore not simply the removal of one product, but a measurable reduction in the environmental impact of the complete weed-control strategy.</p>
    <h4>Demonstrating an environmental result</h4>
    <p>The intervention should begin with a named herbicide, crop and catchment for which the water authority has already identified recurring exceedances. Participating growers would record baseline applications, after which an independent party would verify which treatments were displaced by the technology.</p>
    <p>Monitoring should combine:</p>
    <ul>
      <li>hectares treated without the target herbicide;</li>
      <li>the quantity and environmental risk of applications displaced;</li>
      <li>substitute products and chemical rescue treatments;</li>
      <li>weed-control efficacy and crop outcomes;</li>
      <li>concentrations in nearby ditches or field drains;</li>
      <li>rainfall and comparable untreated fields.</li>
    </ul>
    <p>This design would allow the programme to distinguish genuine source reduction from simple substitution. Catchment-level water quality should remain a longer-term outcome rather than the sole basis for payment, because concentrations are also affected by weather, neighbouring farms, historic residues and other substances.</p>
    <table class="spec-table">
      <tr><th>Stakeholder</th><th>Relevance to the intervention</th><th>Evidential boundary</th></tr>
      <tr><td>Water board</td><td>Responsible for local surface-water quality and recurring exceedances. It could co-fund a verified reduction in emissions from participating farms.</td><td>Rijnland's monitoring establishes a local problem, but not the impact of a specific technology before deployment.</td></tr>
      <tr><td>Growers</td><td>Decide which weed-control method is used and carry the operational and financial risk of changing it.</td><td>Participation requires comparable efficacy, manageable implementation risk and viable economics.</td></tr>
      <tr><td>Aquatic ecosystems and downstream users</td><td>Benefit when harmful emissions from treated fields are reduced.</td><td>Removing an application creates a credible causal pathway, but does not imply an equivalent percentage improvement across the catchment.</td></tr>
      <tr><td>Policymakers</td><td>Must reconcile water-quality objectives with an economically viable agricultural sector.</td><td>The Crop Protection Future Vision 2030 establishes policy direction, not demand for a particular technology.</td></tr>
      <tr><td>Drinking-water companies</td><td>May have an interest where the selected area also affects a groundwater abstraction or drinking-water source.</td><td>Their treatment obligations and budgets are institutionally separate from the water board's surface-water responsibilities.</td></tr>
    </table>
    <p class="src"><b>Sources:</b> <a href="https://www.clo.nl/indicatoren/nl054712-gewasbeschermingsmiddelen-in-oppervlaktewater-2013-2024" target="_blank" rel="noopener">CLO, crop-protection products in surface water, 2013 to 2024</a>; <a href="https://www.rijnland.net/actueel/nieuwsoverzicht/correctie-op-nieuwsbericht-24-maart-2026/" target="_blank" rel="noopener">Rijnland, corrected 2025 monitoring results</a>; <a href="https://www.landbouwportaalrijnland.nl/nieuws/zorgvuldig-gebruik-pendimethalin-cruciaal-voor-waterkwaliteit/" target="_blank" rel="noopener">Landbouwportaal Rijnland, pendimethalin and water quality</a>.</p>
  </div>
</template>

<template id="dd-bill" data-k="" data-h="The economic cost of downstream treatment">
  <div class="detail-body">
    <p>A 2026 study commissioned by the Ministry of Infrastructure and Water Management estimates the drinking-water treatment costs associated with continued pesticide contamination at selected groundwater abstraction sites in protection zones.</p>
    <p>The study demonstrates that contamination creates material downstream costs. It does not estimate the savings achievable through robotic weeding: it examines all pesticides and metabolites at selected groundwater sites, whereas the proposed intervention would target a specific herbicide use within a defined surface-water catchment.</p>
    <table class="spec-table">
      <tr><th>Estimate</th><th>What it represents</th><th>Evidential status</th></tr>
      <tr><td>€142.2 million</td><td>Capital already invested in additional treatment at the groundwater abstraction sites included in the study.</td><td>Estimated historical expenditure; ±40% uncertainty.</td></tr>
      <tr><td>€14.2 million annually</td><td>Operating costs associated with that existing treatment capacity.</td><td>Estimated recurring expenditure; ±40% uncertainty.</td></tr>
      <tr><td>€10 million annually</td><td>Estimated pesticide-related monitoring expenditure across the Dutch drinking-water sector.</td><td>Sector-wide estimate.</td></tr>
      <tr class="hl"><td>€993 million</td><td>Additional investment if continued pesticide pressure ultimately requires active-carbon treatment at every site included in the study.</td><td>Conditional scenario without a specified implementation date; ±40% uncertainty.</td></tr>
      <tr class="hl"><td>€95.6 million annually</td><td>Additional operating expenditure under that active-carbon treatment scenario.</td><td>Conditional scenario; ±40% uncertainty.</td></tr>
    </table>
    <div class="warn"><b>Scope and attribution:</b> These figures demonstrate the scale of potential downstream exposure and strengthen the economic case for preventing contamination at source. They cannot be treated as savings generated by one technology, attributed to a single herbicide, or counted as funding available to the proposed programme. Existing treatment infrastructure would also remain necessary if an individual farm changed its weed-control method.</div>
    <h4>The economic hypothesis to test</h4>
    <p>The relevant comparison is local and marginal: where a named herbicide contributes to a documented water-quality failure, does the incremental cost of replacing it upstream compare favourably with the locally attributable environmental or treatment benefit downstream?</p>
    <p>For a water board, the primary rationale may be compliance with surface-water objectives rather than avoided drinking-water treatment. A drinking-water company becomes a potential co-funder only where the selected catchment also affects one of its sources and the company confirms a corresponding economic interest.</p>
    <p>The national cost estimates therefore establish the wider economic significance of source protection. The pilot must establish whether that logic holds for the particular substance, crop, catchment and technology selected.</p>
    <p class="src"><b>Source:</b> <a href="https://open.overheid.nl/overheid/openbaarmakingen/api/v0/attachment/ead8f98d-73ca-465b-8e5c-7c85527b4e23" target="_blank" rel="noopener">Haskoning, Zuiveringskosten bij verdere verontreiniging grondwaterbeschermingsgebieden door bestrijdingsmiddelen, commissioned by the Ministry of Infrastructure and Water Management, February 2026</a>.</p>
  </div>
</template>

<template id="dd-wur" data-k="Deep dive · the farm" data-h="The Vredepeel trial in detail">
  <div class="detail-body">
    <p>Wageningen Research ran a four-year crop-system experiment (2020 to 2023) on sandy soil at Vredepeel, comparing a conventional reference system with an integrated crop-management system that used fewer crop-protection products. The economic analysis is in the original field report, section 8.1.5 and Table 19, published by BO Akkerbouw.</p>
    <table class="spec-table">
      <tr><th>Measure</th><th>Carrots</th><th>Seed onions</th><th>Note</th></tr>
      <tr><td>Extra labour, integrated vs reference</td><td>+57.8 h/ha</td><td>+29.2 h/ha</td><td>Four-year average, section 8.1.5</td></tr>
      <tr><td>Sales revenue</td><td>−8%</td><td>−15%</td><td>Largely high weed pressure</td></tr>
      <tr><td>Contribution margin per ha, hand-weeding charged to the crop</td><td>−27%</td><td>−39%</td><td>Illustrative, Table 19</td></tr>
      <tr><td>Weighted contribution margin per ha after hand-weeding</td><td colspan="2">−16% across the rotation</td><td>Whole-system result</td></tr>
      <tr><td>Chemicals vs energy</td><td colspan="2">Less spent on chemicals, more on energy</td><td>Mechanical passes replaced sprays</td></tr>
    </table>
    <div class="warn">These are outcomes of one multi-practice field experiment and its economic assumptions. They are not the cost of abandoning all herbicides, a Dutch national average, or a forecast for a robot. For a slide, the extra hours per hectare are the clearest way to show the grower's operational pain.</div>
    <p><b>Figures not used.</b> Supplier pitch material in circulation quotes figures such as 30 to 70% yield loss from uncontrolled weeds, 5% loss when weeds are removed in the critical period, 10 people per hectare for manual weeding, and a 20 to 25% fall in spraying days from climate change. None could be traced to a checkable source or transferred to Dutch carrots or onions. The 5% is a chosen tolerance used to define the critical weed-control window, not a measured outcome. The defensible visual is the WUR trade-off above.</p>
    <p class="src">Sources: Wageningen Research, Integrale aanpak voor de akkerbouw op zand, Rapportage 2020-2023, sections 8.1.5 and Table 19; BO Akkerbouw summary. UMass Extension on the critical period of weed control.</p>
  </div>
</template>

<template id="dd-subsidy" data-k="" data-h="The costs already exist. They sit in different budgets.">
  <div class="detail-body">
    <p>The farmer pays to control weeds and carries the production risk. The water authority funds measures to protect surface water. Drinking-water companies monitor and treat affected sources. These are distinct costs borne by different actors.</p>
    <table class="spec-table">
      <tr><th>Actor</th><th>Current economic exposure</th></tr>
      <tr><td>Grower</td><td>Pays for weed control and bears the consequences if it is late or ineffective: additional labour, crop damage, lower yield and a larger weed burden in subsequent seasons. The grower ultimately chooses the method used on the field.</td></tr>
      <tr><td>Water authority</td><td>Rijnland has authorised €2.15 million for agricultural soil- and water-quality measures through 2026. Eligible measures include reducing emissions from crop-protection products and mechanical weed control.</td></tr>
      <tr><td>Drinking-water company</td><td>At the groundwater abstraction sites studied, a ministry-commissioned report estimates that drinking-water companies have already invested €142.2 million in additional treatment associated with pesticides and their metabolites. Operating that treatment costs an estimated €14.2 million each year.</td></tr>
    </table>
    <h4>The economic burden is not theoretical</h4>
    <p>Pesticide pressure already produces expenditure inside and outside the farm gate. Farmers pay to protect their crops; water authorities fund preventive measures; and drinking-water companies incur monitoring and treatment costs downstream.</p>
    <div class="warn"><b>Scope of the evidence:</b> The drinking-water figures cover pesticides and metabolites broadly at selected groundwater sites. They are not estimates of herbicide damage, Rijnland's expenditure or the savings achievable through robotic weed control.</div>
    <p class="src"><b>Sources:</b> <a href="https://lokaleregelgeving.overheid.nl/CVDR707423" target="_blank" rel="noopener">Rijnland's official €2.15 million subsidy decision</a>; <a href="https://open.overheid.nl/details/ead8f98d-73ca-465b-8e5c-7c85527b4e23" target="_blank" rel="noopener">Ministry-commissioned Haskoning study on drinking-water treatment costs</a>; <a href="https://open.overheid.nl/documenten/a5f9310a-06b8-40a9-a6c6-94095bde1c88/file" target="_blank" rel="noopener">Government-published 2025 evidence on growers' weed-control constraints</a>.</p>
  </div>
</template>

<template id="dd-intervention" data-k="The intervention" data-h="Conditional, credible demand before the rollout is financed">
  <div class="detail-body">
    <p>The proposed intervention is to create conditional, credible demand for cleaner weed control before the technology companies have financed a full rollout. Farmers, their group or a machinery buyer would buy the service or robots. A water board could be the anchor environmental co-funder: it would reserve an approved contribution toward lower-pollution adoption, conditional on agreed performance and environmental tests. A paid field-validation phase would lead to larger orders if the tests pass. Techleap could assemble the parties, structure the commitment and bring investors into the process when the purchase conditions become underwritable.</p>
    <p><b>One-sentence thesis:</b> Make demand for effective, economic and cleaner weed control concrete enough that Dutch technology companies can finance the transition from field trials to sales.</p>
  </div>
</template>

<template id="dd-grower" data-k="" data-h="The grower's decision: trial trade-off and buying criteria">
  <div class="detail-body">
    <h4>Cost of the lower-input system · one system trial</h4>
    <p>Wageningen's four-year trial at Vredepeel compared a conventional system with a lower-input system using fewer crop-protection products. Weighted across the rotation, the lower-input system's per-hectare contribution margin after hand-weeding was 16% lower than the reference.</p>
    <table class="spec-table">
      <tr><th>Measure</th><th>Carrots</th><th>Seed onions</th></tr>
      <tr><td>Extra labour per hectare per year</td><td>+57.8 hours</td><td>+29.2 hours</td></tr>
      <tr><td>Sales revenue versus the conventional reference</td><td>−8%</td><td>−15%</td></tr>
      <tr><td>Contribution margin per hectare, hand-weeding charged to the crop</td><td>−27%</td><td>−39%</td></tr>
    </table>
    <div class="warn">The trial tested a whole farming system. These numbers are not the impact of laser robots, of every herbicide-free method, or of all Dutch farms. They establish why growers need credible efficacy and economics before changing practice.</div>
    <h4>The grower's buying criteria</h4>
    <ul>
      <li>Weeds controlled at the required stage</li>
      <li>No unacceptable yield or crop damage</li>
      <li>Enough machine capacity in the treatment window</li>
      <li>Predictable cost per treated hectare</li>
      <li>Clear responsibility for breakdowns, missed treatments and rescue spraying</li>
    </ul>
    <p class="src"><b>Sources:</b> <a href="https://www.bo-akkerbouw.nl/files/Pdfs-Kennis-en-Innovatie/Integrale-aanpak-voor-de-akkerbouw-op-zand-Rapportage-2020-2023.pdf" target="_blank" rel="noopener">Wageningen Research, Vredepeel report 2020 to 2023, section 8.1.5 and Table 19</a>; <a href="https://loonbedrijftamminga.nl/prijzen-meststoffen-2026/" target="_blank" rel="noopener">Loonbedrijf Tamminga, 2026 tariffs, veldspuit per hectare</a>.</p>
  </div>
</template>


<template id="dd-contribution" data-k="" data-h="Set the contribution from verified farm economics, not an arbitrary subsidy rate.">
  <div class="detail-body">
    <p>The farmer contribution is determined separately for each target crop and weed-control operation. Four steps.</p>
    <div class="dd-steps">
      <div class="dd-step">
        <span class="dd-n">1</span>
        <h5>Establish the reference case</h5>
        <p class="dd-lead">Independently verify the current method:</p>
        <ul>
          <li>Weed-control cost per hectare</li>
          <li>Yield and crop margin</li>
          <li>Labour requirements</li>
          <li>Number and timing of treatments</li>
        </ul>
      </div>
      <div class="dd-step">
        <span class="dd-n">2</span>
        <h5>Establish the robotic case</h5>
        <p class="dd-lead">Field trials verify the robot:</p>
        <ul>
          <li>Weed-control efficacy</li>
          <li>Crop damage and yield</li>
          <li>Hectares treated within the operating window</li>
          <li>Operating, maintenance and labour costs</li>
          <li>Expected useful life and residual value</li>
        </ul>
      </div>
      <div class="dd-step">
        <span class="dd-n">3</span>
        <h5>Calculate what the machine is worth to the farm</h5>
        <div class="dd-eq">
          <div><span>Avoided weed-control costs</span></div>
          <div><i>+</i><span>Verified additional crop margin</span></div>
          <div><i>−</i><span>Robot operating and transition costs</span></div>
          <div class="res"><i>=</i><span>Gross economic value created</span></div>
          <div><i>−</i><span>Minimum required saving or crop-margin improvement</span></div>
          <div class="res"><i>=</i><span>Maximum economically justified farmer contribution</span></div>
        </div>
        <p class="dd-lead">The minimum required saving is established through farmer interviews. It ensures that adopting the machine creates a genuine financial incentive rather than merely leaving the farmer no worse off. Present values over an agreed period. Unverified yield improvements count as zero.</p>
      </div>
      <div class="dd-step">
        <span class="dd-n">4</span>
        <h5>Confirm what the farmer will pay upfront</h5>
        <p class="dd-lead">Structured farmer interviews establish an initial contribution range, based on willingness to pay and the amount that can be invested without borrowing or weakening farm operations.</p>
        <div class="dd-lower">
          <div><b>Maximum economically justified contribution</b><span>From step 3</span></div>
          <i>Take the lower of</i>
          <div><b>Farmer's binding upfront offer</b><span>Informed by the interviews and confirmed in a signed conditional purchase agreement</span></div>
        </div>
        <p class="dd-lead">The public fund covers the remaining machine price, up to its programme cap. If the combined contributions do not cover the manufacturer's price, the purchase does not proceed.</p>
      </div>
    </div>
    <p><b>The farmer makes an affordable upfront contribution and retains a defined share of the verified economic benefit created by the machine.</b></p>
    <p class="src"><b>Sources:</b> <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10075499/" target="_blank" rel="noopener">Shang et al. 2023, How much can farmers pay for weeding robots?</a> (defines the maximum acquisition value as the machine price at which farm profitability equals that of the current method); <a href="https://www.gov.uk/guidance/advanced-market-commitments-amc" target="_blank" rel="noopener">UK government, Advance Market Commitments guidance</a>.</p>
  </div>
</template>

<template id="dd-funding" data-k="" data-h="Buyers purchase the machine. Public institutions pay part of the price for the environmental benefit.">
  <div class="detail-body">
    <p>The mechanism separates the commercial value received by the buyer from the wider water-quality benefit. The buyer pays what the machine is worth to the farm and can afford upfront. The public contribution covers the remaining purchase price, up to a fixed programme cap, because reduced herbicide use benefits water quality beyond the farm.</p>
    <h4>Financial responsibilities</h4>
    <table class="spec-table"><tr><th>Participant</th><th>Commitment</th><th>Payment or receipt</th></tr><tr><td>Grower</td><td>Conditional commitment for a defined number of machines, target crop and delivery period, with a maximum upfront contribution</td><td>Pays the agreed contribution when a machine passes validation</td></tr><tr><td>Agricultural contractor</td><td>Conditional commitment for machines used to provide robotic weed control across several farms</td><td>Pays the agreed contribution; receives service payments from growers</td></tr><tr><td>Water board</td><td>Reserves a capped contribution toward each qualifying purchase</td><td>Pays the public contribution to the supplier at delivery</td></tr><tr><td>Province</td><td>May add matching funding to the same cap</td><td>Contributes to the same capped public contribution</td></tr><tr><td>Technology company</td><td>Sets the machine price and accepts the performance standard, delivery and support obligations</td><td>Receives the full purchase price at delivery</td></tr></table>
    <h4>The payment process</h4>
    <h5>1. Public budget decision</h5>
    <p>The water board, and the province if it participates, approve a maximum programme budget and a maximum contribution per machine before supplier selection. The decision names the eligible crop, catchment and environmental objective.</p>
    <h5>2. Conditional buyer commitments</h5>
    <p>Growers and agricultural contractors sign conditional purchase commitments stating machines, crop, delivery period and maximum upfront contribution.</p>
    <h5>3. Independent validation</h5>
    <p>An independent party tests each machine against the published performance standard: weed-control efficacy, crop damage, hectares treated within the operating window, seasonal reliability, maintenance support and displacement of the targeted herbicide application.</p>
    <h5>4. Activation</h5>
    <p>If a machine passes, the buyer's contribution and the reserved public contribution activate the purchase. If together they do not cover the supplier's price, the purchase does not proceed.</p>
    <h5>5. Payment at delivery</h5>
    <p>The buyer pays its contribution and the public programme pays its contribution directly to the technology company when the machine is delivered. The buyer then owns the machine and pays its operating costs. The buyer does not repay the public contribution. No supplier is guaranteed a sale.</p>
    <h4>Existing Dutch basis</h4>
    <p>Rijnland's current regulation already permits subsidies for agricultural measures that improve water and soil quality. Productive measures can receive up to 40% of eligible costs. Funding under the crop-protection theme is currently capped at €10,000 per applicant.</p>
    <p>The current scheme uses individual applications and a first-come allocation process. A market commitment would require a separate or amended instrument that reserves funding against published performance conditions before suppliers are selected.</p>
    <p class="src"><b>Sources:</b> <a href="https://lokaleregelgeving.overheid.nl/CVDR698620" target="_blank" rel="noopener">Rijnland regulation CVDR698620</a>; <a href="https://lokaleregelgeving.overheid.nl/CVDR707423" target="_blank" rel="noopener">Rijnland decision CVDR707423</a>; <a href="https://unievanwaterschappen.nl/waterkwaliteit/" target="_blank" rel="noopener">Unie van Waterschappen, water quality</a>.</p>
  </div>
</template>

<template id="dd-precedents" data-k="" data-h="Gavi shows the structure. The UK scheme shows that public money can reward verified robotic weeding.">
  <div class="detail-body">
    <p>No existing programme reproduces the proposed Dutch intervention in full. The advance market commitment structure comes from Gavi. The UK Sustainable Farming Incentive shows only that a public body can pay for verified robotic weed-control activity; it is not a model for financing machine purchases.</p>
    <h4>Gavi Pneumococcal AMC: the primary precedent</h4>
    <p>Donors provided a US$1.5 billion financial backstop for future vaccine demand before manufacturers expanded supply. Manufacturers could access the committed market after meeting defined product requirements and entering long-term supply agreements. More than one supplier qualified.</p>
    <p>In 2020, UNICEF contracted a new manufacturer to supply ten million doses annually for ten years at US$2 per dose, 43% below the US$3.50 Gavi price at the beginning of the AMC.</p>
    <h5>What transfers</h5>
    <ul>
    <li>Funding is reserved before a supplier is selected.</li>
    <li>The required performance is published in advance.</li>
    <li>Any supplier that meets the standard can qualify. No supplier is guaranteed a sale.</li>
    <li>Funding becomes payable only after the supplier satisfies the stated conditions.</li>
    </ul>
    <h5>What differs</h5>
    <p>Gavi and UNICEF purchased vaccines through a centralised procurement system. In the Dutch programme, growers and agricultural contractors make the purchases and own the machines. The public institutions contribute part of the purchase price for the environmental benefit. The technology company sets the price; the programme does not.</p>
    <h4>UK Sustainable Farming Incentive: evidence of payment for verified activity</h4>
    <p>The scheme pays £150 per hectare per year for three years when qualifying mechanical robotic equipment controls weeds on eligible crops. Participants must retain evidence of the work performed, such as machine-operation records or a contractor's invoice.</p>
    <p>This shows that a public body can define robotic weed control as an eligible activity, verify it and pay for it. It does not aggregate future purchases, set a performance standard for suppliers, or contribute to a machine's purchase price. It is not a model for the Dutch purchase mechanism.</p>
    <h4>Combined design</h4>
    <p>The Dutch proposal adopts Gavi's advance funding and supplier qualification structure and applies it to machine purchases by growers and agricultural contractors. It adds a buyer contribution set by verified farm economics and affordability, and a capped public contribution toward the remaining purchase price.</p>
    <p class="src"><b>Sources:</b> <a href="https://www.gavi.org/news/media-room/pneumonia-vaccine-price-drops-dramatically-lower-income-countries-thanks-gavi" target="_blank" rel="noopener">Gavi, pneumonia vaccine price drop announcement</a>; <a href="https://www.gavi.org/investing-gavi/innovative-financing/pneumococcal-amc" target="_blank" rel="noopener">Gavi, Pneumococcal AMC</a>; <a href="https://www.gov.uk/find-funding-for-land-or-farms/prf4-mechanical-robotic-weeding" target="_blank" rel="noopener">Defra, Sustainable Farming Incentive PRF4 mechanical robotic weeding</a>.</p>
  </div>
</template>

<template id="dd-investor" data-k="" data-h="The commitment replaces expressions of interest with specified purchase obligations">
  <div class="detail-body">
    <p>The mechanism does not remove manufacturing or execution risk. It changes the evidence available for assessing customer demand.</p>
    <h4>Evidence before the programme</h4>
    <table class="spec-table"><tr><th>Available evidence</th><th>Remaining uncertainty</th></tr><tr><td>Growers express interest in the technology</td><td>No obligation to purchase</td></tr><tr><td>Field demonstrations show that weeds can be treated</td><td>No accepted performance standard</td></tr><tr><td>Public institutions support cleaner water</td><td>No budget attached to a qualifying purchase</td></tr><tr><td>The technology company proposes a production plan</td><td>No contracted volume against which to size production</td></tr></table>
    <h4>Evidence after qualification</h4>
    <table class="spec-table"><tr><th>Contractual evidence</th><th>Investor can assess</th></tr><tr><td>Signed conditional purchase commitments</td><td>Buyer identity, number of machines, target crop and delivery period</td></tr><tr><td>Stated maximum buyer contribution per machine</td><td>Demonstrated willingness and ability to pay</td></tr><tr><td>Adopted public budget and maximum contribution per machine</td><td>Availability and limits of the public contribution</td></tr><tr><td>Published performance standard and independent validation results</td><td>Efficacy, crop safety, capacity, reliability and support</td></tr><tr><td>Supplier's own price against the combined contributions</td><td>Whether purchases activate at that price</td></tr><tr><td>Production plan linked to activated purchases</td><td>Capital requirement and expected utilisation</td></tr></table>
    <h4>Conditions required for credible demand</h4>
    <p>A conditional commitment should identify the buyer, target crop, number of machines, maximum upfront contribution, delivery period and acceptance procedure. It does not state a supplier price: the price is set by each supplier when it competes.</p>
    <p>It should also define the consequences of passing or failing validation. A buyer should not retain an unrestricted right to withdraw after a machine satisfies the agreed conditions and the combined contributions cover the supplier's price.</p>
    <p>The public contribution requires the same level of certainty: an approved budget, a defined maximum per machine, and a payment obligation that activates when the stated conditions are met.</p>
    <h4>Financing consequence</h4>
    <p>The investment round still finances manufacturing, working capital and commercial execution.</p>
    <p>The difference is that the production plan can be evaluated against signed purchase commitments and an approved public contribution rather than non-binding customer interest. This does not guarantee investment. It gives investors stronger evidence with which to assess the scale and timing of demand.</p>
    <p class="src"><b>Sources:</b> <a href="https://techleap.nl/reports/capital-in-deeptech-from-diagnosis-to-action" target="_blank" rel="noopener">Techleap, Capital in deep tech: from diagnosis to action</a>; <a href="https://www.gavi.org/investing-gavi/innovative-financing/pneumococcal-amc" target="_blank" rel="noopener">Gavi, Pneumococcal AMC</a>.</p>
  </div>
</template>
