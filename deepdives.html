<template id="dd-water-data" data-k="" data-h="From national evidence to a local intervention">
  <div class="detail-body">
    <p>National monitoring establishes the scale of the water-quality problem. In 2024, nearly 80% of locations in the Dutch crop-protection monitoring network recorded at least one substance above an ecological water-quality standard. Exceedances have declined substantially since the early 2010s, but the rate of improvement has slowed and the intended reduction has not been achieved.</p>
    <p>This national indicator covers the full range of crop-protection products, including herbicides, fungicides, insecticides and their metabolites. It therefore demonstrates a widespread water-quality challenge, but does not isolate the contribution of herbicides or identify the crops and fields responsible for individual exceedances.</p>
    <div class="warn"><b>Interpretation:</b> National data establishes the materiality of the problem. A credible intervention must then connect a specific substance, crop and catchment to a technology capable of displacing that particular use.</div>
    <h4>Establishing the local causal pathway</h4>
    <p>Rijnland's corrected 2025 monitoring results provide a more specific connection to weed control. Pendimethalin, a soil herbicide, repeatedly exceeded standards in bulb-growing and arable areas, while metazachlor remained a persistent problem around tree nurseries. Rijnland identifies spray drift and runoff from treated fields as pathways through which pendimethalin reaches surface water.</p>
    <p>However, eliminating one substance does not necessarily eliminate the environmental burden. Rijnland also observed substitution towards lenacil. The relevant outcome is therefore not simply the removal of one product, but a measurable reduction in the environmental impact of the complete weed-control strategy.</p>
    <h4>Demonstrating an environmental result</h4>
    <p>The intervention should begin with a named herbicide, crop and catchment for which the water authority has already identified recurring exceedances. Participating growers would record baseline applications, after which an independent party would verify which treatments were displaced by the technology.</p>
    <p>Monitoring should combine:</p>
    <ul>
      <li>hectares treated without the target herbicide;</li>
      <li>the quantity and environmental risk of applications displaced;</li>
      <li>substitute products and chemical rescue treatments;</li>
      <li>weed-control efficacy and crop outcomes;</li>
      <li>concentrations in nearby ditches or field drains;</li>
      <li>rainfall and comparable untreated fields.</li>
    </ul>
    <p>This design would allow the programme to distinguish genuine source reduction from simple substitution. Catchment-level water quality should remain a longer-term outcome rather than the sole basis for payment, because concentrations are also affected by weather, neighbouring farms, historic residues and other substances.</p>
    <table class="spec-table">
      <tr><th>Stakeholder</th><th>Relevance to the intervention</th><th>Evidential boundary</th></tr>
      <tr><td>Water board</td><td>Responsible for local surface-water quality and recurring exceedances. It could co-fund a verified reduction in emissions from participating farms.</td><td>Rijnland's monitoring establishes a local problem, but not the impact of a specific technology before deployment.</td></tr>
      <tr><td>Growers</td><td>Decide which weed-control method is used and carry the operational and financial risk of changing it.</td><td>Participation requires comparable efficacy, manageable implementation risk and viable economics.</td></tr>
      <tr><td>Aquatic ecosystems and downstream users</td><td>Benefit when harmful emissions from treated fields are reduced.</td><td>Removing an application creates a credible causal pathway, but does not imply an equivalent percentage improvement across the catchment.</td></tr>
      <tr><td>Policymakers</td><td>Must reconcile water-quality objectives with an economically viable agricultural sector.</td><td>The Crop Protection Future Vision 2030 establishes policy direction, not demand for a particular technology.</td></tr>
      <tr><td>Drinking-water companies</td><td>May have an interest where the selected area also affects a groundwater abstraction or drinking-water source.</td><td>Their treatment obligations and budgets are institutionally separate from the water board's surface-water responsibilities.</td></tr>
    </table>
    <p class="src"><b>Sources:</b> <a href="https://www.clo.nl/indicatoren/nl054712-gewasbeschermingsmiddelen-in-oppervlaktewater-2013-2024" target="_blank" rel="noopener">CLO, crop-protection products in surface water, 2013 to 2024</a>; <a href="https://www.rijnland.net/actueel/nieuwsoverzicht/correctie-op-nieuwsbericht-24-maart-2026/" target="_blank" rel="noopener">Rijnland, corrected 2025 monitoring results</a>; <a href="https://www.landbouwportaalrijnland.nl/nieuws/zorgvuldig-gebruik-pendimethalin-cruciaal-voor-waterkwaliteit/" target="_blank" rel="noopener">Landbouwportaal Rijnland, pendimethalin and water quality</a>.</p>
  </div>
</template>

<template id="dd-bill" data-k="" data-h="The economic cost of downstream treatment">
  <div class="detail-body">
    <p>A 2026 study commissioned by the Ministry of Infrastructure and Water Management estimates the drinking-water treatment costs associated with continued pesticide contamination at selected groundwater abstraction sites in protection zones.</p>
    <p>The study demonstrates that contamination creates material downstream costs. It does not estimate the savings achievable through robotic weeding: it examines all pesticides and metabolites at selected groundwater sites, whereas the proposed intervention would target a specific herbicide use within a defined surface-water catchment.</p>
    <table class="spec-table">
      <tr><th>Estimate</th><th>What it represents</th><th>Evidential status</th></tr>
      <tr><td>€142.2 million</td><td>Capital already invested in additional treatment at the groundwater abstraction sites included in the study.</td><td>Estimated historical expenditure; ±40% uncertainty.</td></tr>
      <tr><td>€14.2 million annually</td><td>Operating costs associated with that existing treatment capacity.</td><td>Estimated recurring expenditure; ±40% uncertainty.</td></tr>
      <tr><td>€10 million annually</td><td>Estimated pesticide-related monitoring expenditure across the Dutch drinking-water sector.</td><td>Sector-wide estimate.</td></tr>
      <tr class="hl"><td>€993 million</td><td>Additional investment if continued pesticide pressure ultimately requires active-carbon treatment at every site included in the study.</td><td>Conditional scenario without a specified implementation date; ±40% uncertainty.</td></tr>
      <tr class="hl"><td>€95.6 million annually</td><td>Additional operating expenditure under that active-carbon treatment scenario.</td><td>Conditional scenario; ±40% uncertainty.</td></tr>
    </table>
    <div class="warn"><b>Scope and attribution:</b> These figures demonstrate the scale of potential downstream exposure and strengthen the economic case for preventing contamination at source. They cannot be treated as savings generated by one technology, attributed to a single herbicide, or counted as funding available to the proposed programme. Existing treatment infrastructure would also remain necessary if an individual farm changed its weed-control method.</div>
    <h4>The economic hypothesis to test</h4>
    <p>The relevant comparison is local and marginal: where a named herbicide contributes to a documented water-quality failure, does the incremental cost of replacing it upstream compare favourably with the locally attributable environmental or treatment benefit downstream?</p>
    <p>For a water board, the primary rationale may be compliance with surface-water objectives rather than avoided drinking-water treatment. A drinking-water company becomes a potential co-funder only where the selected catchment also affects one of its sources and the company confirms a corresponding economic interest.</p>
    <p>The national cost estimates therefore establish the wider economic significance of source protection. The pilot must establish whether that logic holds for the particular substance, crop, catchment and technology selected.</p>
    <p class="src"><b>Source:</b> <a href="https://open.overheid.nl/overheid/openbaarmakingen/api/v0/attachment/ead8f98d-73ca-465b-8e5c-7c85527b4e23" target="_blank" rel="noopener">Haskoning, Zuiveringskosten bij verdere verontreiniging grondwaterbeschermingsgebieden door bestrijdingsmiddelen, commissioned by the Ministry of Infrastructure and Water Management, February 2026</a>.</p>
  </div>
</template>

<template id="dd-wur" data-k="Deep dive · the farm" data-h="The Vredepeel trial in detail">
  <div class="detail-body">
    <p>Wageningen Research ran a four-year crop-system experiment (2020 to 2023) on sandy soil at Vredepeel, comparing a conventional reference system with an integrated crop-management system that used fewer crop-protection products. The economic analysis is in the original field report, section 8.1.5 and Table 19, published by BO Akkerbouw.</p>
    <table class="spec-table">
      <tr><th>Measure</th><th>Carrots</th><th>Seed onions</th><th>Note</th></tr>
      <tr><td>Extra labour, integrated vs reference</td><td>+57.8 h/ha</td><td>+29.2 h/ha</td><td>Four-year average, section 8.1.5</td></tr>
      <tr><td>Sales revenue</td><td>−8%</td><td>−15%</td><td>Largely high weed pressure</td></tr>
      <tr><td>Contribution margin per ha, hand-weeding charged to the crop</td><td>−27%</td><td>−39%</td><td>Illustrative, Table 19</td></tr>
      <tr><td>Weighted contribution margin per ha after hand-weeding</td><td colspan="2">−16% across the rotation</td><td>Whole-system result</td></tr>
      <tr><td>Chemicals vs energy</td><td colspan="2">Less spent on chemicals, more on energy</td><td>Mechanical passes replaced sprays</td></tr>
    </table>
    <div class="warn">These are outcomes of one multi-practice field experiment and its economic assumptions. They are not the cost of abandoning all herbicides, a Dutch national average, or a forecast for a robot. For a slide, the extra hours per hectare are the clearest way to show the grower's operational pain.</div>
    <p><b>Figures not used.</b> Supplier pitch material in circulation quotes figures such as 30 to 70% yield loss from uncontrolled weeds, 5% loss when weeds are removed in the critical period, 10 people per hectare for manual weeding, and a 20 to 25% fall in spraying days from climate change. None could be traced to a checkable source or transferred to Dutch carrots or onions. The 5% is a chosen tolerance used to define the critical weed-control window, not a measured outcome. The defensible visual is the WUR trade-off above.</p>
    <p class="src">Sources: Wageningen Research, Integrale aanpak voor de akkerbouw op zand, Rapportage 2020-2023, sections 8.1.5 and Table 19; BO Akkerbouw summary. UMass Extension on the critical period of weed control.</p>
  </div>
</template>

<template id="dd-payback" data-k="" data-h="What the payback calculator assumes">
  <div class="detail-body">
    <p><b>What it is.</b> A payback calculation for a light-weeding robot bought by one grower. Weeding cost today, per hectare per year, is herbicide passes × cost per pass plus hand-weeding hours × hourly wage. Weeding cost with the robot is the herbicide passes and hand-weeding hours still needed, at the same rates. The difference is the saving per hectare. The robot is assumed to be solar-powered, so no charging cost is included. Operator time is not included either: no public figure exists for it. Machines with a diesel generator would add fuel cost.</p>
    <p>Payback in years = machine price × machines needed ÷ (saving per hectare × hectares − annual service × machines needed). Machines needed = hectares ÷ capacity per machine per season, rounded up.</p>
    <h4>Where the numbers come from</h4>
    <p>Machine price about €115,000, service about €11,000 per year and capacity 225 hectares per machine per season are one supplier's customer model, converted from pounds at 1.14 and rounded. The three presets reproduce that model's cost estimates: a herbicide programme at about €200 per hectare (3 passes × €70), transplanted organic brassica or lettuce at about €400 (20 hours × €20), and fine-seeded organic crops such as salad onion, baby leaf and carrot at about €1,700 (85 hours × €20). The default of €70 per herbicide pass is an assumption: a Dutch contractor's 2026 price list charges €27 to €37.50 per hectare per spraying pass depending on area, and the product itself comes on top; there is no single public figure for product cost per pass, which varies by crop and substance. Three passes at €70 gives €210 per hectare per year, inside the supplier model's €57 to €342 range for a herbicide programme. Wageningen's Vredepeel trial measured 57.8 extra hand-weeding hours per hectare for carrots and 29.2 for seed onions in its lower-input system, which is why hours, not a lump sum, are the input.</p>
    <table class="spec-table">
      <tr><th>Current practice, defaults</th><th>Cost per ha</th><th>Payback, 30 ha, robot does all weeding</th><th>Payback, 100 ha</th></tr>
      <tr><td>Herbicide programme</td><td>€210</td><td>No payback: €6,300 saving is below €11,000 service</td><td>11 years</td></tr>
      <tr><td>Organic, transplanted</td><td>€400</td><td>115 years</td><td>4 years</td></tr>
      <tr class="hl"><td>Organic, fine-seeded</td><td>€1,700</td><td>2.9 years</td><td>0.7 years</td></tr>
    </table>
    <p><b>What it shows.</b> A grower who controls weeds with herbicide has no financial reason to buy the machine. A grower who pays for hand-weeding often does. The water-quality benefit does not appear in the grower's payback. That is the gap the conditional order and the public contribution are designed to close.</p>
    <div class="warn">Assumptions that make the result optimistic: yield is unchanged; no financing cost; no residual value; no downtime; a solar-powered robot with no charging cost; no operator cost; the leftover herbicide passes and hand-weeding hours are the only remaining costs. The supplier's own sheet assumed the robot replaces all weeding cost, added one year of service to the price and then ignored service in later years. This calculator charges service every year and lets you keep some herbicide passes and hand-weeding hours.</div>
    <p><b>When it makes sense to use.</b> As a screen for which growers have private demand today (organic, fine-seeded crops) and which need a price difference paid by someone else (herbicide users in a target catchment). Not as a forecast for any named machine or farm. Gate 2 replaces the presets with grower invoices; gate 3 replaces the capacity and price with supplier field records.</p>
    <p class="src"><b>Sources:</b> <a href="https://loonbedrijftamminga.nl/prijzen-meststoffen-2026/" target="_blank" rel="noopener">Loonbedrijf Tamminga, 2026 tariffs: spraying €27 to €37.50 per hectare per pass</a>; <a href="https://www.bo-akkerbouw.nl/files/Pdfs-Kennis-en-Innovatie/Integrale-aanpak-voor-de-akkerbouw-op-zand-Rapportage-2020-2023.pdf" target="_blank" rel="noopener">Wageningen Research, Vredepeel report, section 8.1.5</a>. Machine price, service, capacity and cost presets: one supplier's customer model, not published.</p>
  </div>
</template>

<template id="dd-subsidy" data-k="" data-h="The costs already exist. They sit in different budgets.">
  <div class="detail-body">
    <p>The farmer pays to control weeds and carries the production risk. The water authority funds measures to protect surface water. Drinking-water companies monitor and treat affected sources. These are distinct costs borne by different actors.</p>
    <table class="spec-table">
      <tr><th>Actor</th><th>Current economic exposure</th></tr>
      <tr><td>Grower</td><td>Pays for weed control and bears the consequences if it is late or ineffective: additional labour, crop damage, lower yield and a larger weed burden in subsequent seasons. The grower ultimately chooses the method used on the field.</td></tr>
      <tr><td>Water authority</td><td>Rijnland has authorised €2.15 million for agricultural soil- and water-quality measures through 2026. Eligible measures include reducing emissions from crop-protection products and mechanical weed control.</td></tr>
      <tr><td>Drinking-water company</td><td>At the groundwater abstraction sites studied, a ministry-commissioned report estimates that drinking-water companies have already invested €142.2 million in additional treatment associated with pesticides and their metabolites. Operating that treatment costs an estimated €14.2 million each year.</td></tr>
    </table>
    <h4>The economic burden is not theoretical</h4>
    <p>Pesticide pressure already produces expenditure inside and outside the farm gate. Farmers pay to protect their crops; water authorities fund preventive measures; and drinking-water companies incur monitoring and treatment costs downstream.</p>
    <div class="warn"><b>Scope of the evidence:</b> The drinking-water figures cover pesticides and metabolites broadly at selected groundwater sites. They are not estimates of herbicide damage, Rijnland's expenditure or the savings achievable through robotic weed control.</div>
    <p class="src"><b>Sources:</b> <a href="https://lokaleregelgeving.overheid.nl/CVDR707423" target="_blank" rel="noopener">Rijnland's official €2.15 million subsidy decision</a>; <a href="https://open.overheid.nl/details/ead8f98d-73ca-465b-8e5c-7c85527b4e23" target="_blank" rel="noopener">Ministry-commissioned Haskoning study on drinking-water treatment costs</a>; <a href="https://open.overheid.nl/documenten/a5f9310a-06b8-40a9-a6c6-94095bde1c88/file" target="_blank" rel="noopener">Government-published 2025 evidence on growers' weed-control constraints</a>.</p>
  </div>
</template>

<template id="dd-intervention" data-k="The intervention" data-h="Conditional, credible demand before the rollout is financed">
  <div class="detail-body">
    <p>The proposed intervention is to create conditional, credible demand for cleaner weed control before the technology companies have financed a full rollout. Farmers, their group or a machinery buyer would buy the service or robots. A water board could be the anchor environmental co-funder: it would reserve an approved contribution toward lower-pollution adoption, conditional on agreed performance and environmental tests. A paid field-validation phase would lead to larger orders if the tests pass. Techleap could assemble the parties, structure the commitment and bring investors into the process when the purchase conditions become underwritable.</p>
    <p><b>One-sentence thesis:</b> Make demand for effective, economic and cleaner weed control concrete enough that Dutch technology companies can finance the transition from field trials to sales.</p>
  </div>
</template>

<template id="dd-grower" data-k="" data-h="The grower's decision: trial trade-off and payback">
  <div class="detail-body">
    <h4>Cost of the lower-input system · one system trial</h4>
    <p>Wageningen's four-year trial at Vredepeel compared a conventional system with a lower-input system using fewer crop-protection products. Weighted across the rotation, the lower-input system's per-hectare contribution margin after hand-weeding was 16% lower than the reference.</p>
    <table class="spec-table">
      <tr><th>Measure</th><th>Carrots</th><th>Seed onions</th></tr>
      <tr><td>Extra labour per hectare per year</td><td>+57.8 hours</td><td>+29.2 hours</td></tr>
      <tr><td>Sales revenue versus the conventional reference</td><td>−8%</td><td>−15%</td></tr>
      <tr><td>Contribution margin per hectare, hand-weeding charged to the crop</td><td>−27%</td><td>−39%</td></tr>
    </table>
    <div class="warn">The trial tested a whole farming system. These numbers are not the impact of laser robots, of every herbicide-free method, or of all Dutch farms. They establish why growers need credible efficacy and economics before changing practice.</div>
    <h4>Payback of a light-weeding robot · based on one supplier's model</h4>
    <p>Machine about €115,000, service about €11,000 per year, 225 hectares per machine per season. Payback in years = price ÷ (current weeding cost replaced per year − annual service). Assumes no extra labour, energy, downtime or yield change. Supplier figures, converted to euros and rounded.</p>
    <table class="spec-table">
      <tr><th>Current practice</th><th>Cost per ha per year</th><th>Payback, 30 ha</th><th>Payback, 100 ha</th></tr>
      <tr><td>Herbicide programme</td><td>€210</td><td>None: €6,300 saving is below €11,000 service</td><td>11 years</td></tr>
      <tr><td>Organic, transplanted</td><td>€400</td><td>115 years</td><td>4 years</td></tr>
      <tr class="hl"><td>Organic, fine-seeded</td><td>€1,700</td><td>2.9 years</td><td>0.7 years</td></tr>
    </table>
    <p>A grower who controls weeds with herbicide has no financial reason to buy the machine. A grower who pays for hand-weeding often does. The water-quality benefit does not appear in the grower's payback. The interactive calculator is on the website.</p>
    <h4>The grower's buying criteria</h4>
    <ul>
      <li>Weeds controlled at the required stage</li>
      <li>No unacceptable yield or crop damage</li>
      <li>Enough machine capacity in the treatment window</li>
      <li>Predictable cost per treated hectare</li>
      <li>Clear responsibility for breakdowns, missed treatments and rescue spraying</li>
    </ul>
    <p class="src"><b>Sources:</b> <a href="https://www.bo-akkerbouw.nl/files/Pdfs-Kennis-en-Innovatie/Integrale-aanpak-voor-de-akkerbouw-op-zand-Rapportage-2020-2023.pdf" target="_blank" rel="noopener">Wageningen Research, Vredepeel report 2020 to 2023, section 8.1.5 and Table 19</a>; <a href="https://loonbedrijftamminga.nl/prijzen-meststoffen-2026/" target="_blank" rel="noopener">Loonbedrijf Tamminga, 2026 tariffs, veldspuit per hectare</a>. Payback figures: one supplier's customer model, not published.</p>
  </div>
</template>

<template id="dd-instruments" data-k="" data-h="One intervention, three different instruments">
  <div class="detail-body">
    <p>An advance market commitment, an advance purchase agreement and a subsidy are not interchangeable.</p>
    <h4>Advance market commitment</h4>
    <p>An advance market commitment establishes a funded future market before a supplier has been selected. It states that a defined amount of qualifying output will be purchased if a supplier meets published requirements.</p>
    <p>The commitment remains open to multiple suppliers. Its purpose is to give companies and investors confidence that a market will exist if the technology performs.</p>
    <h4>Advance purchase agreement</h4>
    <p>An advance purchase agreement is the supplier-specific contract awarded once a company qualifies. It defines the machines or services to be purchased, the price, delivery schedule, warranties and consequences of non-performance.</p>
    <p>The agreement may be signed before validation is complete, but its purchase obligation activates only when the supplier passes the agreed acceptance test.</p>
    <h4>Public contribution</h4>
    <p>The public contribution covers part of the temporary cost difference between conventional weed control and the cleaner alternative. It does not pay a company merely to develop a robot.</p>
    <p>The contribution could be structured as a purchase voucher, price premium or payment for verified environmental performance. The appropriate Dutch legal structure would require separate procurement, budget-authority and state-aid analysis.</p>
    <h4 class="big-h">How the Clean Weeding Commitment works</h4>
    <h4>1: Aggregate real buyers</h4>
    <p>Growers, cooperatives or agricultural contractors state how many machines, or how much robotic weeding capacity, they will purchase at an agreed price if the technology passes validation.</p>
    <p>The pilot must select one commercial unit. A commitment for machines creates an equipment order book. A commitment for treated hectares creates demand for a service operator. These should not be mixed within the same contract.</p>
    <h4>2: Fund the temporary price difference</h4>
    <p>The buyers commit the amount they can economically justify. A water authority, province or other public participant reserves a capped contribution toward the additional cost of the cleaner method.</p>
    <p>Together, the buyer contribution and the public contribution create a fully funded conditional order.</p>
    <h4>3: Publish one commercial specification</h4>
    <p>The programme defines the result, not the preferred technical solution. The specification covers:</p>
    <ul>
    <li>Target crop, weeds and herbicide operation to be displaced</li>
    <li>Minimum weed-control efficacy</li>
    <li>Maximum crop damage and yield impact</li>
    <li>Hectares treated within the operating window</li>
    <li>Seasonal uptime and service response</li>
    <li>Maximum total cost per hectare</li>
    <li>Delivery date and manufacturing capacity</li>
    </ul>
    <p>Mechanical, light and laser systems may all compete if they can deliver the result.</p>
    <h4>4: Validate suppliers independently</h4>
    <p>Qualified suppliers receive smaller paid contracts for field validation. The test protocol, baseline, rescue-treatment rules and acceptance thresholds are fixed before suppliers are selected.</p>
    <p>An independent technical party verifies the result. Passing or failing cannot depend on a discretionary decision after the trial.</p>
    <h4>5: Activate the purchase agreements</h4>
    <p>When a machine passes, the pre-agreed orders become binding. The buyer must purchase the allocated volume, and the reserved public contribution becomes payable under its agreed conditions.</p>
    <p>The supplier-specific agreement covers price, units, delivery, warranty, servicing and remedies for delayed or inadequate performance.</p>
    <h4>6: Finance production</h4>
    <p>The manufacturer presents investors and lenders with:</p>
    <ul>
    <li>Independent field results</li>
    <li>Named and creditworthy buyers</li>
    <li>Contracted units and prices</li>
    <li>A delivery schedule</li>
    <li>Secured buyer and public contributions</li>
    <li>Evidence of manufacturing cost and capacity</li>
    </ul>
    <p>The commitment does not eliminate manufacturing, execution or warranty risk. It replaces uncertain customer interest with contracted demand, making the commercial-scale investment more underwritable.</p>
    <div class="warn">The market commitment creates the opportunity. Validation determines who qualifies. The purchase agreement converts qualification into revenue.</div>
    <p class="src"><b>Sources:</b> <a href="https://siepr.stanford.edu/publications/working-paper/designing-advance-market-commitments-new-vaccines" target="_blank" rel="noopener">Kremer, Levin and Snyder, Designing advance market commitments for new vaccines (SIEPR)</a>; <a href="https://www.cgdev.org/publication/9781933286020-making-markets-vaccines-ideas-action" target="_blank" rel="noopener">Center for Global Development, Making markets for vaccines</a>; <a href="https://www.gavi.org/our-impact/evaluation-studies/pneumococcal-amc-process-and-design" target="_blank" rel="noopener">Gavi, Pneumococcal AMC process and design evaluation</a>.</p>
  </div>
</template>

<template id="dd-precedents" data-k="" data-h="Gavi and Frontier: what transfers to robotic weeding">
  <div class="detail-body">
    <p>Advance market commitments are designed for situations in which suppliers must invest before sufficient commercial demand exists. They do not select one winner in advance. They define the result, commit funding and allow qualifying suppliers to compete for the market.</p>
    <h4>Gavi: the completed and independently evaluated precedent</h4>
    <p>In 2009, governments and the Gates Foundation committed $1.5 billion to accelerate the availability of pneumococcal vaccines in lower-income countries.</p>
    <p>The mechanism combined:</p>
    <ol class="num">
    <li>A target product profile defining the minimum qualifying product</li>
    <li>Independent technical qualification</li>
    <li>Competitive calls for supply</li>
    <li>A higher purchase price for a limited initial volume</li>
    <li>Long-term supply agreements at a lower "tail price"</li>
    <li>Quantities reserved for later entrants to preserve competition</li>
    </ol>
    <p>Manufacturers received support for the early volumes but were required to supply vaccines over the longer term at the agreed lower price.</p>
    <p>By 2020:</p>
    <ul>
    <li>Eight supply agreements covered 1.75 billion doses through 2029</li>
    <li>Sixty eligible countries had introduced the vaccine</li>
    <li>The lowest tail price had fallen from $3.50 to $2.00 per dose</li>
    <li>Gavi estimated that successive price reductions would save $546 million over the contracts' lifetimes</li>
    </ul>
    <p>The independent evaluation found little effect on early vaccine research because two qualifying products were already at an advanced stage. Its stronger effect was on production capacity, availability and deployment. Pfizer and GSK made additional capacity investments in response to the commitment and resulting supply agreements.</p>
    <p>That limitation makes Gavi especially relevant here. The Clean Weeding Commitment is not intended to finance basic research. It targets machines that already work technically but lack sufficient validated demand to finance commercial production.</p>
    <h4>Frontier: the modern private-market architecture</h4>
    <p>Frontier aggregates corporate commitments to purchase $1.8 billion of permanent carbon removal through 2040.</p>
    <p>Buyers first determine how much they are prepared to spend. Frontier combines those commitments into an annual demand pool and evaluates suppliers against published criteria.</p>
    <p>It uses two different contracts:</p>
    <ul>
    <li>Small prepurchases provide limited upfront funding to early suppliers.</li>
    <li>Larger offtake agreements commit buyers to purchasing future carbon removal at an agreed price if and when it is delivered.</li>
    </ul>
    <p>Suppliers are paid for delivered and verified output. Frontier does not invest in their equity.</p>
    <p>Frontier is a useful design precedent, but it is still too young to provide the same outcome evidence as Gavi. It demonstrates how fragmented buyers can aggregate demand and use different contracts for suppliers at different stages of maturity.</p>
    <h4>What transfers</h4>
    <ul>
    <li>Commit funding before choosing the supplier</li>
    <li>Define minimum performance before the competition begins</li>
    <li>Let multiple technologies qualify</li>
    <li>Separate early validation from scale purchasing</li>
    <li>Allocate orders only after independent verification</li>
    <li>Reserve part of the commitment for later or better suppliers</li>
    <li>Use larger contracts for suppliers ready to manufacture at scale</li>
    </ul>
    <h4>What does not transfer automatically</h4>
    <p>A verified tonne of carbon removal or a vaccine dose is relatively standardised. Weed control is crop-, soil-, season- and location-specific.</p>
    <p>A Dutch programme therefore cannot commit to "robotic weeding" in general. It must define a particular commercial application, for example weed control in seed onions within a specified operating window, and contract against the performance required in that application.</p>
    <p>The central lesson is not that robotic weeders resemble vaccines or carbon removal. It is that credible future demand can induce capacity investment when qualification, price and purchasing obligations are specified in advance.</p>
    <p class="src"><b>Sources:</b> <a href="https://www.gavi.org/our-impact/evaluation-studies/pneumococcal-amc-outcomes-and-impact-evaluation" target="_blank" rel="noopener">Gavi, Pneumococcal AMC outcomes and impact evaluation</a>; <a href="https://www.gavi.org/news/document-library/2020-pneumococcal-amc-annual-report" target="_blank" rel="noopener">Gavi, 2020 Pneumococcal AMC annual report</a>; <a href="https://frontierclimate.com/" target="_blank" rel="noopener">Frontier</a>; <a href="https://siepr.stanford.edu/publications/working-paper/designing-advance-market-commitments-new-vaccines" target="_blank" rel="noopener">Kremer, Levin and Snyder, Designing advance market commitments for new vaccines (SIEPR)</a>.</p>
  </div>
</template>

<template id="dd-agri" data-k="" data-h="Pull mechanisms have already changed agricultural markets">
  <div class="detail-body">
    <p>There is no established advance-purchase programme for robotic weeders. The closest agricultural evidence comes from AgResults, a multilateral initiative that pays private companies only after predefined and independently verified results have been achieved.</p>
    <p>These programmes were not advance purchase agreements. They nevertheless demonstrate that temporary demand-side incentives can change supplier behaviour, increase agricultural-technology adoption and attract private investment.</p>
    <h4>Kenya: scaling physical farm equipment</h4>
    <p>The Kenya On-Farm Storage Challenge rewarded companies for selling verified storage capacity to smallholder farmers.</p>
    <p>Companies had to exceed a minimum sales threshold before becoming eligible for a prize. Some products also had to pass an efficacy test. Payments therefore depended on demonstrated sales and functional equipment, not participation in a pilot.</p>
    <p>Between 2015 and 2018:</p>
    <ul>
    <li>Nine companies participated</li>
    <li>1.39 million storage devices were sold</li>
    <li>More than 300,000 farmers were reached</li>
    <li>$6.25 million in incentives was awarded</li>
    <li>Suppliers invested more than $4.85 million of their own capital</li>
    </ul>
    <p>The independent evaluation concluded that the programme created an emerging market and increased technology adoption. A later assessment found continued activity, new entrants and product innovation after the competition.</p>
    <p>The programme also produced warnings. Farmer-income effects were small, three suppliers generated most sales, and later market growth included lower-quality products and distribution supported by other subsidy programmes.</p>
    <h4>Nigeria: paying for an otherwise undervalued benefit</h4>
    <p>The Nigeria Aflasafe programme paid maize aggregators $18.75 for each verified tonne of maize treated with an aflatoxin-control product.</p>
    <p>A peer-reviewed evaluation found that the programme increased adoption by 56 percentage points and raised net maize income by approximately 16% among participating farmers.</p>
    <p>The market nevertheless remained narrow. Farmers and consumers did not always understand the health benefit, and the long-term market depended partly on standards, testing and continued demand for safer maize.</p>
    <p>This is directly relevant to water quality. The environmental benefit of avoiding a herbicide is not fully captured in the farmer's private return. A public payment may therefore be needed to reward part of that external benefit while the market develops.</p>
    <h4>Vietnam: the importance of measurable outcomes</h4>
    <p>A Vietnamese programme rewarded private companies for introducing rice-production systems intended to increase yields and reduce greenhouse-gas emissions.</p>
    <p>Participating farmers achieved 14% higher yields than comparison farmers and were more likely to use lower-emission practices. However, evaluators could not determine the programme's actual emissions impact because the field measurements were insufficiently reliable.</p>
    <p>This is an important warning for the Dutch case. Payments should not initially depend on detecting changes in rivers or catchments. Water quality is affected by weather, multiple farms and multiple substances, making short-term attribution difficult.</p>
    <p>Initial payments should instead depend on observable operational outcomes:</p>
    <ul>
    <li>A named herbicide application displaced</li>
    <li>Hectares treated</li>
    <li>Weed-control efficacy</li>
    <li>Crop damage and yield</li>
    <li>Substitute or rescue spraying</li>
    <li>Machine uptime and field capacity</li>
    </ul>
    <p>Water monitoring remains important, but it should validate the longer-term environmental thesis rather than determine every short-term payment.</p>
    <h4>What transfers to the Dutch intervention</h4>
    <p>The agricultural evidence supports four design choices:</p>
    <ol class="num">
    <li>Pay for verified results, not programme participation.</li>
    <li>Allow multiple suppliers to compete.</li>
    <li>Use an independent verifier.</li>
    <li>Make the incentive large enough to change supplier and buyer behaviour, but temporary enough that the resulting market must eventually stand on its own.</li>
    </ol>
    <p>The proposed Clean Weeding Commitment adds something these programmes generally lacked: binding conditional orders established before manufacturers invest in commercial production.</p>
    <p class="src"><b>Sources:</b> <a href="https://agresults.org/projects/kenya/" target="_blank" rel="noopener">AgResults, Kenya on-farm storage project</a>; <a href="https://agresults.org/wp-content/uploads/2024/02/AgResults-Kenya-On-Farm-Storage-Challenge-Project_final-report.pdf" target="_blank" rel="noopener">AgResults, Kenya on-farm storage final report</a>; <a href="https://www.gov.uk/research-for-development-outputs/evaluation-final-report-kenya-on-farm-storage-challege-project" target="_blank" rel="noopener">UK FCDO, independent evaluation of the Kenya on-farm storage project</a>; <a href="https://link.springer.com/article/10.1186/s40066-022-00377-2" target="_blank" rel="noopener">Agriculture and Food Security, evaluation of the Nigeria Aflasafe programme</a>; <a href="https://agresults.org/projects/vietnam/" target="_blank" rel="noopener">AgResults, Vietnam emissions reduction project</a>.</p>
  </div>
</template>

<template id="dd-contract" data-k="" data-h="What makes the commitment credible to investors">
  <div class="detail-body">
    <p>A press release, memorandum of understanding or list of interested growers does not materially reduce commercial risk. The commitment becomes valuable only when the money, purchasing obligation and acceptance conditions are fixed before the manufacturer invests.</p>
    <h4>The essential parties</h4>
    <h5>Commercial buyer</h5>
    <p>A grower, cooperative, agricultural contractor or service operator signs the conditional purchase order.</p>
    <p>The buyer should be the party that will own the machine or purchase the robotic-weeding service. The water authority should not be described as the machine buyer unless it intends to own the equipment.</p>
    <h5>Public outcome funder</h5>
    <p>A water authority, province or another authorised body reserves the public contribution.</p>
    <p>Its role is to pay for the environmental value that the commercial buyer cannot fully monetise. It is therefore better described as an anchor outcome funder than as an anchor buyer.</p>
    <h5>Supplier</h5>
    <p>The robotic-weeding company accepts the performance requirements, delivery schedule, warranty and service obligations. It receives the larger order only after passing independent validation.</p>
    <h5>Independent verifier</h5>
    <p>A technically credible organisation applies the test protocol and certifies whether the machine has passed. It does not select a preferred supplier after seeing the results.</p>
    <h5>Techleap</h5>
    <p>Techleap designs and convenes the mechanism. It recruits buyers and funders, standardises the specification and contracts, coordinates supplier selection and introduces investors once the commitment is credible.</p>
    <p>Techleap should not receive, manage or invest the committed capital.</p>
    <h4>Minimum contractual content</h4>
    <p>For the order to matter to an investor, it should specify:</p>
    <ul>
    <li>Number of machines or contracted hectares</li>
    <li>Buyer contribution</li>
    <li>Public contribution and its authorised funding source</li>
    <li>Total price or price formula</li>
    <li>Acceptance thresholds</li>
    <li>Independent verification process</li>
    <li>Delivery dates and permitted delays</li>
    <li>Minimum manufacturing capacity</li>
    <li>Warranty and seasonal service requirements</li>
    <li>Treatment of crop damage and rescue spraying</li>
    <li>Remedies for failed delivery or underperformance</li>
    <li>Conditions under which either party may terminate</li>
    <li>Allocation rules if multiple suppliers qualify</li>
    </ul>
    <h4>How risk is allocated</h4>
    <p><b>Technical-performance risk:</b> remains with the supplier until validation is passed.</p>
    <p><b>Validation risk:</b> shared through a smaller paid field contract, preventing the supplier from bearing the entire cost of producing public evidence.</p>
    <p><b>Demand risk:</b> transfers to the buyers once the acceptance conditions are met and the conditional orders activate.</p>
    <p><b>Environmental-premium risk:</b> transfers to the public funder once the specified environmental result is verified.</p>
    <p><b>Manufacturing and delivery risk:</b> remains with the supplier under the purchase agreement.</p>
    <p><b>Budget exposure:</b> remains capped at the amount formally authorised by the public participant.</p>
    <h4>Guardrails</h4>
    <h5>Avoid overpaying incumbents</h5>
    <p>Use competitive pricing, multiple qualification windows and a declining public contribution. Reserve part of the order volume for later entrants.</p>
    <h5>Prevent weak products from entering the market</h5>
    <p>Require seasonal service, warranty coverage, spare-parts availability and minimum uptime. Verification cannot stop at the first successful demonstration.</p>
    <h5>Prevent environmental substitution</h5>
    <p>Count substitute products and rescue sprays. A machine should not qualify merely by avoiding one herbicide while causing the use of another equally problematic product.</p>
    <h5>Avoid speculative demand forecasts</h5>
    <p>Base the first commitment on named buyers prepared to make a financial contribution. Scale through predefined tranches rather than announcing a large unsupported national number.</p>
    <h5>Preserve automaticity</h5>
    <p>Once the machine passes, the order must activate according to the existing contract. If another committee can reconsider the purchase after validation, the supplier still faces the original commercial risk.</p>
    <h4>Remaining legal questions</h4>
    <p>The economic structure is credible; its Dutch legal vehicle is not yet established.</p>
    <p>Before launch, the programme would need to determine:</p>
    <ul>
    <li>Whether the public contribution is a subsidy, procurement payment or another form of outcome-based support</li>
    <li>Which institution has the authority to make a multi-year conditional commitment</li>
    <li>Applicable public-procurement procedures</li>
    <li>State-aid treatment</li>
    <li>Whether grower contributions must be deposited or otherwise secured</li>
    <li>How overlapping agricultural subsidies would be treated</li>
    </ul>
    <p>These are implementation questions, not reasons to dilute the mechanism. If the commitment cannot become legally and financially enforceable, it should not be presented to investors as contracted demand.</p>
    <p class="src"><b>Sources:</b> <a href="https://www.gavi.org/our-impact/evaluation-studies/pneumococcal-amc-process-and-design" target="_blank" rel="noopener">Gavi, Pneumococcal AMC process and design evaluation</a>; <a href="https://www.gavi.org/news/document-library/2020-pneumococcal-amc-annual-report" target="_blank" rel="noopener">Gavi, 2020 Pneumococcal AMC annual report</a>; <a href="https://agresults.org/wp-content/uploads/2024/02/AgResults-Kenya-On-Farm-Storage-Challenge-Project_final-report.pdf" target="_blank" rel="noopener">AgResults, Kenya on-farm storage final report</a>; <a href="https://agresults.org/wp-content/uploads/2026/06/AgResults_Crowding-In-Evaluation-Report_December-2025.pdf" target="_blank" rel="noopener">AgResults, crowding-in evaluation report, December 2025</a>.</p>
  </div>
